name: Build whisper.cpp (Hexagon HTP v81)

on:
  workflow_dispatch:
    inputs:
      whisper_branch:
        description: 'whisper.cpp branch'
        default: 'master'
        required: true
      patch_mode:
        description: 'ADD 补丁：broadcast=图级回退(已验证), kernelfix=修kernel让广播走正确路径(试验)'
        type: choice
        options:
          - none
          - fp16
          - broadcast
          - bcast_only
          - noncontig_only
          - kernelfix
          - krowbcast
          - flushfix
          - flushfix2
          - prof
          - hmxfix
          - hmxdbg
          - hmxfix2
          - hmxdbg2
          - q8mm5
          - q8dbg
          - deccpu
        default: 'kernelfix'
        required: true

# 显式赋予创建 Release 的写入权限
permissions:
  contents: write

jobs:
  build-android-hexagon:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'ggml-org/whisper.cpp'
          ref: ${{ github.event.inputs.whisper_branch }}
          submodules: recursive

      - name: 安装编译依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build wget xz-utils

      - name: 下载并设置 Android NDK r28
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          echo "ANDROID_NDK=/tmp/android-ndk-r28" >> $GITHUB_ENV

      - name: 下载并解压 Hexagon SDK v6.6.0.0
        run: |
          cd /tmp
          wget -q https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v6.6.0.0/hexagon-sdk-v6.6.0.0-amd64-lnx.tar.xz
          tar -xf hexagon-sdk-v6.6.0.0-amd64-lnx.tar.xz
          # 动态自动定位包含 'incs' 的真实根目录
          SDK_ROOT=$(find /tmp -maxdepth 3 -type d -name "incs" 2>/dev/null | head -n 1 | xargs dirname)
          if [ -n "$SDK_ROOT" ]; then
            echo "HEXAGON_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
            echo "✅ 成功定位 SDK 真实根目录: $SDK_ROOT"
            TOOLS_PATH=$(find $SDK_ROOT -path "*/HEXAGON_Tools/19.0.07" 2>/dev/null | head -n 1)
            if [ -n "$TOOLS_PATH" ]; then
              echo "HEXAGON_TOOLS_ROOT=$TOOLS_PATH" >> $GITHUB_ENV
              echo "✅ 成功定位 Tools 目录: $TOOLS_PATH"
            else
              echo "❌ 错误: 在 SDK 根目录下未发现 HEXAGON_Tools/19.0.07！"
              exit 1
            fi
          else
            echo "❌ 错误: 解压后未找到包含 'incs' 文件夹的 SDK 目录，请检查解压包！"
            exit 1
          fi

      - name: 修复官方 SDK 的 CMake 兼容性问题
        run: |
          CMAKE_FILE=$(find /tmp -path "*/build/cmake/hexagon_fun.cmake" 2>/dev/null | head -n 1)
          if [ -n "$CMAKE_FILE" ]; then
            sed -i '99,106s/^/# /' "$CMAKE_FILE"
            echo "✅ 成功修复 CMake 文件: $CMAKE_FILE"
          else
            echo "⚠️ 未找到 hexagon_fun.cmake，跳过修复步骤。"
          fi

      # 【核心改动】用 llama.cpp 最新的 ggml-hexagon 整体覆盖 whisper.cpp 自带的旧版
      - name: 覆盖最新 ggml-hexagon（含 L2 缓存重做 + HMX 修复）
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama
          rm -rf ggml/src/ggml-hexagon
          cp -r /tmp/llama/ggml/src/ggml-hexagon ggml/src/
          cp -f /tmp/llama/ggml/include/ggml-hexagon.h ggml/include/ggml-hexagon.h
          echo "=== 覆盖完成，新版关键默认值（应显示 mm_select=3 / fa_select=2）==="
          grep -n "opt_mm_select = \|opt_fa_select = " ggml/src/ggml-hexagon/ggml-hexagon.cpp || true
          echo "=== 确认新版文件就位（应有 dma-queue.c / work-queue.c / htp-tensor.c）==="
          ls ggml/src/ggml-hexagon/htp/ || true

      # 【ADD 补丁】在覆盖之后、编译之前打。找不到锚点会显式报错（防止白编）
      - name: 打 ADD 补丁 A 组 (patch_mode=${{ inputs.patch_mode }})
        run: |
          python3 - << 'EOF'
          mode = "${{ inputs.patch_mode }}"

          if mode == "none":
              print("patch_mode=none，跳过补丁")
              raise SystemExit(0)
          

          if mode == "hmxfix":
              # 放宽 HMX 矩阵乘的行数门槛：M=4 (bs3 bo3) 也走 HMX
              # 实测 bs5 bo5 (M=6) 走 HMX 后每行吞吐为 HVX 的 1.7 倍
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old = "    if (m <= HTP_MM_HMX_MIN_NROWS) {"
              t_new = "    if (m < HTP_MM_HMX_MIN_NROWS) { // SM8850 v81: allow M=4 on HMX"

              if tsrc.count(t_old) != 1:
                  print("ERROR: hmxfix anchor not found in ggml-hexagon.cpp, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: hmxfix applied to ggml-hexagon.cpp")
              raise SystemExit(0)

          if mode == "hmxdbg":
              # hmxfix + 诊断日志：打印每个 matmul 的 M/批处理/类型/资格判定
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old1 = "    if (m <= HTP_MM_HMX_MIN_NROWS) {"
              t_new1 = "    if (m < HTP_MM_HMX_MIN_NROWS) { // SM8850 v81: allow M=4 on HMX"
              if tsrc.count(t_old1) != 1:
                  print("ERROR: hmxdbg anchor1 not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(t_old1, t_new1)

              t_old2 = ("    // Check HMX eligibility and try precomputing HMX parameters\n"
                        "    bool hmx_enabled = (sess->n_hmx > 0) && (opt_mm_select >= 3);\n")
              t_new2 = ("    // Check HMX eligibility and try precomputing HMX parameters\n"
                        "    bool hmx_enabled = (sess->n_hmx > 0) && (opt_mm_select >= 3);\n"
                        "    GGML_LOG_INFO(\"ggml-hex: hmxdbg ne00 %d ne01 %d ne10 %d ne11 %d ne12 %d m %d batched %d wtype %d elig %d\\n\", (int) src0->ne[0], (int) src0->ne[1], (int) src1->ne[0], ne11, ne12, (is_matmul_id ? ne12 : ne11), (int) is_batched, (int) wtype, (int) ggml_hexagon_matmul_is_hmx_eligible(src0, src1, dst, ne01_padded, is_matmul_id, is_batched));\n")
              if tsrc.count(t_old2) != 1:
                  print("ERROR: hmxdbg anchor2 not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(t_old2, t_new2)

              open(tpath, "w").write(tsrc)
              print("OK: hmxdbg applied to ggml-hexagon.cpp (2 anchors)")
              raise SystemExit(0)

          if mode == "hmxdbg2":
              # hmxfix2(门槛全放) + 打印 elig / preok / kernel_type，定位 HMX 回退原因
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old1 = "    if (m <= HTP_MM_HMX_MIN_NROWS) {"
              t_new1 = "    if (m < 1) { // SM8850 v81: HMX for any M (decode M=3)"
              if tsrc.count(t_old1) != 1:
                  print("ERROR: hmxdbg2 anchor1 not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(t_old1, t_new1)

              t_old2 = ("    if (hmx_enabled && ggml_hexagon_matmul_is_hmx_eligible(src0, src1, dst, ne01_padded, is_matmul_id, is_batched)) {\n"
                        "        if (ggml_hexagon_precompute_hmx_mm_params(sess, src0, src1, dst, wtype, ne00_padded, ne01_padded, ne02, ne11, ne12, ne11_padded, is_matmul_id, is_batched, vtcm_budget, kparams)) {\n"
                        "            goto finalize;\n"
                        "        }\n"
                        "    }\n")
              t_new2 = ("    {\n"
                        "        bool elig = hmx_enabled && ggml_hexagon_matmul_is_hmx_eligible(src0, src1, dst, ne01_padded, is_matmul_id, is_batched);\n"
                        "        bool preok = false;\n"
                        "        if (elig) {\n"
                        "            preok = ggml_hexagon_precompute_hmx_mm_params(sess, src0, src1, dst, wtype, ne00_padded, ne01_padded, ne02, ne11, ne12, ne11_padded, is_matmul_id, is_batched, vtcm_budget, kparams);\n"
                        "        }\n"
                        "        GGML_LOG_INFO(\"ggml-hex: hmxdbg2 ne00 %d ne01 %d ne11 %d m %d batched %d wtype %d elig %d preok %d vtcm %zu\\n\", (int) src0->ne[0], (int) src0->ne[1], ne11, (is_matmul_id ? ne12 : ne11), (int) is_batched, (int) wtype, (int) elig, (int) preok, vtcm_budget);\n"
                        "        if (preok) {\n"
                        "            goto finalize;\n"
                        "        }\n"
                        "    }\n")
              if tsrc.count(t_old2) != 1:
                  print("ERROR: hmxdbg2 anchor2 not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(t_old2, t_new2)

              open(tpath, "w").write(tsrc)
              print("OK: hmxdbg2 applied to ggml-hexagon.cpp (2 anchors)")
              raise SystemExit(0)

          if mode == "hmxfix2":
              # 彻底放开 HMX 行数门槛：decode M=3 (bs3 bo3) 也走 HMX
              # 日志实测 decode matmul m=3 elig=0 被门槛拦截；encoder m=1500/448 本就走 HMX
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old = "    if (m <= HTP_MM_HMX_MIN_NROWS) {"
              t_new = "    if (m < 1) { // SM8850 v81: HMX for any M (decode M=3)"

              if tsrc.count(t_old) != 1:
                  print("ERROR: hmxfix2 anchor not found in ggml-hexagon.cpp, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: hmxfix2 applied to ggml-hexagon.cpp")
              raise SystemExit(0)

          if mode == "prof":
              # 诊断版：把 profile 逐算子耗时日志从 DEBUG 提为 INFO（release 构建可见）
              # 运行时配合 GGML_HEXAGON_PROFILE=3（或1）使用
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old = 'GGML_LOG_DEBUG("ggml-hex: %s profile-'
              t_new = 'GGML_LOG_INFO("ggml-hex: %s profile-'

              if tsrc.count(t_old) != 2:
                  print("ERROR: prof anchor count != 2 in ggml-hexagon.cpp, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: prof applied to ggml-hexagon.cpp (2 log sites)")
              raise SystemExit(0)

          if mode == "flushfix":
              # 修缓存层：对所有 compute 输入无条件 flush，绕过 dirty 区间跟踪（htp/htp-tensor.c）
              tpath = "ggml/src/ggml-hexagon/htp/htp-tensor.c"
              tsrc = open(tpath).read()

              t_old = "        if (t && (t->flags & HTP_TENSOR_COMPUTE) && is_tensor_dirty(ctx, t)) {"
              t_new = "        if (t && (t->flags & HTP_TENSOR_COMPUTE) && (is_tensor_dirty(ctx, t) || true)) { // SM8850 v81 fix: unconditional flush"

              if tsrc.count(t_old) != 1:
                  print("ERROR: flushfix anchor not found in htp-tensor.c, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: flushfix applied to htp-tensor.c")
              raise SystemExit(0)

          if mode in ("kernelfix", "krowbcast"):
              # 修 kernel：收紧 same_shape 判定；kernelfix=禁用row_bcast，krowbcast=保留row_bcast
              kpath = "ggml/src/ggml-hexagon/htp/binary-ops.c"
              ksrc = open(kpath).read()
          
              k_old = (
                  "    bool is_same_shape = !is_add_id && !is_scalar && !is_transposed &&\n"
                  "               (src1->ne[0] == src0->ne[0] && src0->ne[0] % VLEN == 0) &&\n"
                  "               (src1->ne[1] == src0->ne[1] || src1->ne[1] == 1) &&\n"
                  "               (src1->ne[2] == src0->ne[2] || src1->ne[2] == 1) &&\n"
                  "               (src1->ne[3] == src0->ne[3] || src1->ne[3] == 1);\n"
                  "\n"
                  "    bool is_row_bcast = is_same_shape && (src1->ne[1] == 1 && src1->ne[2] == 1 && src1->ne[3] == 1);")
          
              k_new = (
                  "    // SM8850 v81 fix: same_shape requires full 4-dim equality (dim-broadcast DMA read OOB)\n"
                  "    bool is_same_shape = !is_add_id && !is_scalar && !is_transposed &&\n"
                  "               (src1->ne[0] == src0->ne[0] && src0->ne[0] % VLEN == 0) &&\n"
                  "               (src1->ne[1] == src0->ne[1]) &&\n"
                  "               (src1->ne[2] == src0->ne[2]) &&\n"
                  "               (src1->ne[3] == src0->ne[3]);\n"
                  "\n"
                  "    // SM8850 v81 fix: disable row_bcast fast path; broadcast ADD goes to complex path\n"
                  "    bool is_row_bcast = false;")
          
              k_new_rb = (
                  "    // SM8850 v81 fix: same_shape requires full 4-dim equality (dim-broadcast DMA read OOB)\n"
                  "    bool is_same_shape = !is_add_id && !is_scalar && !is_transposed &&\n"
                  "               (src1->ne[0] == src0->ne[0] && src0->ne[0] % VLEN == 0) &&\n"
                  "               (src1->ne[1] == src0->ne[1]) &&\n"
                  "               (src1->ne[2] == src0->ne[2]) &&\n"
                  "               (src1->ne[3] == src0->ne[3]);\n"
                  "\n"
                  "    // SM8850 v81 fix: row_bcast kept, defined independently of same_shape\n"
                  "    bool is_row_bcast = !is_add_id && !is_scalar && !is_transposed &&\n"
                  "               (src1->ne[0] == src0->ne[0] && src0->ne[0] % VLEN == 0) &&\n"
                  "               (src1->ne[1] == 1 && src1->ne[2] == 1 && src1->ne[3] == 1);")

              k_use = k_new if mode == "kernelfix" else k_new_rb
              if ksrc.count(k_old) != 1:
                  print("ERROR: kernel patch anchor not found in binary-ops.c, abort!")
                  raise SystemExit(1)
              open(kpath, "w").write(ksrc.replace(k_old, k_use))
              print("OK: %s applied to binary-ops.c" % mode)
              raise SystemExit(0)
          
          path = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
          src = open(path).read()
          
          old = """        case GGML_OP_MUL:
                  case GGML_OP_ADD:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;"""
          
          fp16_new = """        case GGML_OP_MUL:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;
          
                  case GGML_OP_ADD:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      // SM8850 v81 workaround: non-fp32 ADD broken on HTP, fall back to CPU
                      if (supp && (op->src[0]->type != GGML_TYPE_F32 ||
                                   op->src[1]->type != GGML_TYPE_F32)) {
                          supp = false;
                      }
                      break;"""
          
          bcast_new = """        case GGML_OP_MUL:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;
          
                  case GGML_OP_ADD:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      // SM8850 v81 workaround: broadcast/non-contiguous ADD broken on HTP, fall back to CPU
                      if (supp && (!ggml_is_contiguous(op->src[0]) ||
                                   !ggml_is_contiguous(op->src[1]) ||
                                   op->src[0]->ne[0] != op->src[1]->ne[0] ||
                                   op->src[0]->ne[1] != op->src[1]->ne[1] ||
                                   op->src[0]->ne[2] != op->src[1]->ne[2] ||
                                   op->src[0]->ne[3] != op->src[1]->ne[3])) {
                          supp = false;
                      }
                      break;"""
          
          bcast_only_new = """        case GGML_OP_MUL:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;
          
                  case GGML_OP_ADD:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      // SM8850 v81 workaround: broadcast/non-contiguous ADD broken on HTP, fall back to CPU
                      if (supp && (op->src[0]->ne[0] != op->src[1]->ne[0] ||
                                   op->src[0]->ne[1] != op->src[1]->ne[1] ||
                                   op->src[0]->ne[2] != op->src[1]->ne[2] ||
                                   op->src[0]->ne[3] != op->src[1]->ne[3])) {
                          supp = false;
                      }
                      break;"""
          
          noncontig_only_new = """        case GGML_OP_MUL:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;
          
                  case GGML_OP_ADD:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      // SM8850 v81 workaround: non-contiguous ADD broken on HTP, fall back to CPU
                      if (supp && (!ggml_is_contiguous(op->src[0]) ||
                                   !ggml_is_contiguous(op->src[1]))) {
                          supp = false;
                      }
                      break;"""
          
          if mode not in ("fp16", "broadcast", "bcast_only", "noncontig_only"):
              print("patch_mode=" + mode + " 不在本 step（A），跳过")
              raise SystemExit(0)

          new = {"fp16": fp16_new, "broadcast": bcast_new,
                 "bcast_only": bcast_only_new, "noncontig_only": noncontig_only_new}[mode]
          
          if src.count(old) != 1:
              print("ERROR: patch anchor not found (upstream changed), abort!")
              raise SystemExit(1)
          
          open(path, "w").write(src.replace(old, new))
          print("OK: %s patch applied" % mode)

          if mode == "flushfix2":
              # 轻量变体：每个 op 前整片 L2 刷一次（比逐张量 flush 便宜），绕过 dirty 跟踪
              tpath = "ggml/src/ggml-hexagon/htp/htp-tensor.c"
              tsrc = open(tpath).read()

              t_old = ("void htp_tensor_flush_all(struct htp_context * ctx, const struct htp_tensor * const * tensors, uint32_t n) {\n"
                       "    const struct htp_tensor * dirty_tensors[HTP_OP_MAX_INPUTS];")
              t_new = ("void htp_tensor_flush_all(struct htp_context * ctx, const struct htp_tensor * const * tensors, uint32_t n) {\n"
                       "    flush_all_dcache(ctx); // SM8850 v81 fix: full L2 flush per op, bypass dirty tracking\n"
                       "    const struct htp_tensor * dirty_tensors[HTP_OP_MAX_INPUTS];")

              if tsrc.count(t_old) != 1:
                  print("ERROR: flushfix2 anchor not found in htp-tensor.c, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: flushfix2 applied to htp-tensor.c")
              raise SystemExit(0)

          print("patch_mode=" + mode + " 不在本 step（A），跳过")
          EOF

      - name: 打 ADD 补丁 B 组 q8 系列 (patch_mode=${{ inputs.patch_mode }})
        run: |
          python3 - << 'EOF'
          mode = "${{ inputs.patch_mode }}"

          if mode in ("q8mm5", "deccpu"):
              # 【真正的总根源修复】whisper.cpp 加载模型时，因 hexagon 默认 buffer
              # is_host=true，直接 fread 进显存（whisper.cpp:1924），完全绕过 set_tensor
              # —— tiled repack 从未发生！DSP 内核按 tiled 布局读原始 q8 数据 = 全垃圾。
              # 这解释：fp16 正常 / q8 三内核变体全错 / 单元测试全对 / set_tensor 守卫无效。
              # 修复：supported_mul_mat 接受某量化权重时，就地懒 repack（首次见到才做，
              # 指针集合记录）。ne[1]>32768 的 lm-head 在 hook 之前已被拒绝，保持原始布局。
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              # 1) 同 q8mm：任意 hexagon buffer 视为 repack
              q_old = ("    if (!opt_hostbuf) {\n"
                       "        return ggml_backend_buffer_is_hexagon(b);\n"
                       "    }\n"
                       "    return b->buft->iface.alloc_buffer == ggml_backend_hexagon_repack_buffer_type_alloc_buffer;")
              q_new = ("    // SM8850 q8mm5: treat any hexagon buffer as repack\n"
                       "    // (HOSTBUF=0 semantics without its is_host side-effects).\n"
                       "    return ggml_backend_buffer_is_hexagon(b);")
              if tsrc.count(q_old) != 1:
                  print("ERROR: q8mm5 anchor-1 (is_hexagon_repack) not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(q_old, q_new)

              # 2) 全局：已 repack 权重指针集合
              g_old = "static bool ggml_hexagon_supported_mul_mat(const struct ggml_hexagon_session * sess, const struct ggml_tensor * dst) {"
              g_new = ("// SM8850 q8mm5: track lazily-repacked weight tensors\n"
                       "#define GGML_Q8MM5_MAX 1024\n"
                       "static const void * g_q8mm5_tiled[GGML_Q8MM5_MAX];\n"
                       "static int g_q8mm5_tiled_count = 0;\n"
                       "\n"
                       "static bool ggml_q8mm5_is_tiled(const void * p) {\n"
                       "    for (int i = 0; i < g_q8mm5_tiled_count; i++) {\n"
                       "        if (g_q8mm5_tiled[i] == p) {\n"
                       "            return true;\n"
                       "        }\n"
                       "    }\n"
                       "    return false;\n"
                       "}\n"
                       "\n"
                       "static void ggml_q8mm5_mark(const void * p) {\n"
                       "    if (g_q8mm5_tiled_count < GGML_Q8MM5_MAX) {\n"
                       "        g_q8mm5_tiled[g_q8mm5_tiled_count++] = p;\n"
                       "    }\n"
                       "}\n"
                       "\n" + g_old)
              if tsrc.count(g_old) != 1:
                  print("ERROR: q8mm5 anchor-2 (globals) not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(g_old, g_new)

              # 3) 懒 repack hook：插进 supported_mul_mat 量化分支末尾（所有检查通过后）
              h_old = ("            if (src1->ne[2] != 1 || src1->ne[3] != 1) {\n"
                       "                return false;  // no broadcasting (for now)\n"
                       "            }\n"
                       "\n"
                       "            // src0 (weights) must be repacked\n"
                       "            if (src0->buffer && !ggml_backend_buffer_is_hexagon_repack(src0->buffer)) {\n"
                       "                return false;\n"
                       "            }\n"
                       "            break;")
              h_hook = ("\n"
                       "\n"
                       "            // SM8850 q8mm5: whisper.cpp reads weights directly into this host\n"
                       "            // buffer at load (bypassing set_tensor), so repack never ran.\n"
                       "            // Repack in place on first accepted use.\n"
                       "            if (src0->data && !ggml_q8mm5_is_tiled(src0->data)) {\n"
                       "                const size_t q8mm5_nb = ggml_nbytes(src0);\n"
                       "                void * q8mm5_tmp = malloc(q8mm5_nb);\n"
                       "                if (q8mm5_tmp) {\n"
                       "                    memcpy(q8mm5_tmp, src0->data, q8mm5_nb);\n"
                       "                    ggml_tensor * q8mm5_w = (ggml_tensor *) src0;\n"
                       "                    switch (src0->type) {\n"
                       "                        case GGML_TYPE_Q4_0:   repack_q4_0_tiled(q8mm5_w, q8mm5_tmp, q8mm5_nb); break;\n"
                       "                        case GGML_TYPE_Q4_1:   repack_q4_1_tiled(q8mm5_w, q8mm5_tmp, q8mm5_nb); break;\n"
                       "                        case GGML_TYPE_Q8_0:   repack_q8_0_tiled(q8mm5_w, q8mm5_tmp, q8mm5_nb); break;\n"
                       "                        case GGML_TYPE_IQ4_NL: repack_q4_0_tiled(q8mm5_w, q8mm5_tmp, q8mm5_nb); break;\n"
                       "                        case GGML_TYPE_MXFP4:  repack_mxfp4_tiled(q8mm5_w, q8mm5_tmp, q8mm5_nb); break;\n"
                       "                        default: break;\n"
                       "                    }\n"
                       "                    free(q8mm5_tmp);\n"
                       "                    ggml_q8mm5_mark(src0->data);\n"
                       "                    GGML_LOG_INFO(\"ggml-hex: q8mm5 lazy-repacked weight ne %lld x %lld type %d\\n\",\n"
                       "                                  (long long) src0->ne[0], (long long) src0->ne[1], (int) src0->type);\n"
                       "                }\n"
                       "            }")
              h_new = h_old[:-len("            break;")] + h_hook + "\n            break;"
              if tsrc.count(h_old) != 1:
                  print("ERROR: q8mm5 anchor-3 (lazy repack hook) not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(h_old, h_new)

              # 5) 仅 deccpu：hexagon supports_op 总闸。whisper.cpp 在 decoder 图
              # 分配/计算期间 setenv GGML_HEXAGON_CPU_ONLY，此期间 NPU 拒绝一切算子，
              # 整个 decoder 图经 sched 回退机制落 CPU（v3 已验证该机制）。
              # 背景：turbo 的 decoder 图在 NPU 上必坏（q8/fp16 皆然，encsplit 证明
              # 不是矩阵乘的问题），而 turbo decoder 仅 4 层 CPU 只需 ~5ms/轮。
              if mode == "deccpu":
                  gate_old = ("    // reject ops that match the filter\n"
                              "    if (opt_opfilter && std::regex_match(ggml_op_desc(op), *opt_opfilter)) {\n"
                              "        return false;\n"
                              "    }")
                  gate_new = (gate_old + "\n\n"
                              "    // SM8850 deccpu: while whisper.cpp runs the decoder graph it sets\n"
                              "    // GGML_HEXAGON_CPU_ONLY; refuse everything so the graph lands on CPU.\n"
                              "    if (getenv(\"GGML_HEXAGON_CPU_ONLY\")) {\n"
                              "        return false;\n"
                              "    }")
                  if tsrc.count(gate_old) != 1:
                      print("ERROR: deccpu anchor-5 (supports_op gate) not found, abort!")
                      raise SystemExit(1)
                  tsrc = tsrc.replace(gate_old, gate_new)

              open(tpath, "w").write(tsrc)

              # 6) 仅 deccpu：whisper.cpp 注入 setenv/unsetenv，覆盖 cross + decode
              # 两类图的 init 期分配与运行期计算（init 期必须生效，否则 CPU
              # compute buffer 不会分配）。v2：deccpu 首测 decoder 落 CPU 后输出
              # 语义连贯但内容错 → decoder 本身没问题，污染源在上游 cross/encoder，
              # 故 cross 也拉下 CPU，仅 encoder/conv 留 NPU（turbo 专用包）。
              if mode == "deccpu":
                  wpath = "src/whisper.cpp"
                  wsrc = open(wpath).read()

                  w5_old = "        bool ok = whisper_sched_graph_init(state->sched_cross, state->backends,"
                  w5_new = ("        setenv(\"GGML_HEXAGON_CPU_ONLY\", \"1\", 1);  // SM8850 deccpu\n" + w5_old)
                  if wsrc.count(w5_old) != 1:
                      print("ERROR: deccpu anchor-W5 (cross sched init) not found, abort!")
                      raise SystemExit(1)
                  wsrc = wsrc.replace(w5_old, w5_new)

                  w6_old = ("                });\n"
                            "\n"
                            "        if (!ok) {\n"
                            "            WHISPER_LOG_ERROR(\"%s: failed to init cross allocator\\n\", __func__);")
                  w6_new = ("                });\n"
                            "        unsetenv(\"GGML_HEXAGON_CPU_ONLY\");  // SM8850 deccpu\n"
                            "\n"
                            "        if (!ok) {\n"
                            "            WHISPER_LOG_ERROR(\"%s: failed to init cross allocator\\n\", __func__);")
                  if wsrc.count(w6_old) != 1:
                      print("ERROR: deccpu anchor-W6 (cross init unsetenv) not found, abort!")
                      raise SystemExit(1)
                  wsrc = wsrc.replace(w6_old, w6_new)

                  w7_old = "        ggml_cgraph * gf = whisper_build_graph_cross(wctx, wstate);\n"
                  w7_new = (w7_old + "\n"
                            "        setenv(\"GGML_HEXAGON_CPU_ONLY\", \"1\", 1);  // SM8850 deccpu\n")
                  if wsrc.count(w7_old) != 1:
                      print("ERROR: deccpu anchor-W7 (cross compute setenv) not found, abort!")
                      raise SystemExit(1)
                  wsrc = wsrc.replace(w7_old, w7_new)

                  w8_old = ("        if (!ggml_graph_compute_helper(sched, gf, n_threads)) {\n"
                            "            return false;\n"
                            "        }\n"
                            "    }\n"
                            "\n"
                            "    wstate.t_encode_us += ggml_time_us() - t_start_us;")
                  w8_new = ("        if (!ggml_graph_compute_helper(sched, gf, n_threads)) {\n"
                            "            unsetenv(\"GGML_HEXAGON_CPU_ONLY\");\n"
                            "            return false;\n"
                            "        }\n"
                            "        unsetenv(\"GGML_HEXAGON_CPU_ONLY\");  // SM8850 deccpu\n"
                            "    }\n"
                            "\n"
                            "    wstate.t_encode_us += ggml_time_us() - t_start_us;")
                  if wsrc.count(w8_old) != 1:
                      print("ERROR: deccpu anchor-W8 (cross compute unsetenv) not found, abort!")
                      raise SystemExit(1)
                  wsrc = wsrc.replace(w8_old, w8_new)

                  w1_old = "        bool ok = whisper_sched_graph_init(state->sched_decode, state->backends,"
                  w1_new = ("        // SM8850 deccpu: decoder graph goes to CPU (hexagon corrupts turbo decode)\n"
                            "        setenv(\"GGML_HEXAGON_CPU_ONLY\", \"1\", 1);\n" + w1_old)
                  if wsrc.count(w1_old) != 1:
                      print("ERROR: deccpu anchor-W1 (decode sched init) not found, abort!")
                      raise SystemExit(1)
                  wsrc = wsrc.replace(w1_old, w1_new)

                  w2_old = ("                });\n"
                            "\n"
                            "        if (!ok) {\n"
                            "            WHISPER_LOG_ERROR(\"%s: failed to init decoder allocator\\n\", __func__);")
                  w2_new = ("                });\n"
                            "        unsetenv(\"GGML_HEXAGON_CPU_ONLY\");  // SM8850 deccpu\n"
                            "\n"
                            "        if (!ok) {\n"
                            "            WHISPER_LOG_ERROR(\"%s: failed to init decoder allocator\\n\", __func__);")
                  if wsrc.count(w2_old) != 1:
                      print("ERROR: deccpu anchor-W2 (decode init unsetenv) not found, abort!")
                      raise SystemExit(1)
                  wsrc = wsrc.replace(w2_old, w2_new)

                  w3_old = "        ggml_cgraph * gf = whisper_build_graph_decoder(wctx, wstate, batch, save_alignment_heads_QKs, false);\n"
                  w3_new = (w3_old + "\n"
                            "        setenv(\"GGML_HEXAGON_CPU_ONLY\", \"1\", 1);  // SM8850 deccpu\n")
                  if wsrc.count(w3_old) != 1:
                      print("ERROR: deccpu anchor-W3 (decode compute setenv) not found, abort!")
                      raise SystemExit(1)
                  wsrc = wsrc.replace(w3_old, w3_new)

                  w4_old = ("        logits = ggml_graph_node(gf, -1);\n"
                            "\n"
                            "        if (!ggml_graph_compute_helper(sched, gf, n_threads)) {\n"
                            "            return false;\n"
                            "        }\n"
                            "    }")
                  w4_new = ("        logits = ggml_graph_node(gf, -1);\n"
                            "\n"
                            "        if (!ggml_graph_compute_helper(sched, gf, n_threads)) {\n"
                            "            unsetenv(\"GGML_HEXAGON_CPU_ONLY\");\n"
                            "            return false;\n"
                            "        }\n"
                            "        unsetenv(\"GGML_HEXAGON_CPU_ONLY\");  // SM8850 deccpu\n"
                            "    }")
                  if wsrc.count(w4_old) != 1:
                      print("ERROR: deccpu anchor-W4 (decode compute unsetenv) not found, abort!")
                      raise SystemExit(1)
                  wsrc = wsrc.replace(w4_old, w4_new)

                  open(wpath, "w").write(wsrc)

              print("OK: " + mode + " applied")
              raise SystemExit(0)


          if mode == "q8dbg":
              # q8mm2 全部修改 + 把 dump_op_supp 的日志从 DEBUG 提为 INFO，
              # 使 GGML_HEXAGON_VERBOSE=1 下可见每个算子的支持判定（名字/维度/类型/yes-no），
              # 用于定位剩余回退算子。
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              # 1) 同 q8mm
              q_old = ("    if (!opt_hostbuf) {\n"
                       "        return ggml_backend_buffer_is_hexagon(b);\n"
                       "    }\n"
                       "    return b->buft->iface.alloc_buffer == ggml_backend_hexagon_repack_buffer_type_alloc_buffer;")
              q_new = ("    // SM8850 q8mm2: treat any hexagon buffer as repack\n"
                       "    // (HOSTBUF=0 semantics without its is_host side-effects).\n"
                       "    return ggml_backend_buffer_is_hexagon(b);")
              if tsrc.count(q_old) != 1:
                  print("ERROR: q8dbg anchor-1 (is_hexagon_repack) not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(q_old, q_new)

              # 2) set_tensor 守卫
              s_old = ('    HEX_VERBOSE("ggml-hex: %s set-tensor %s : data %p offset %zu size %zu\\n", sess->c_name(), tensor->name, data, offset, size);\n')
              s_new = (s_old +
                       "\n"
                       "    // SM8850 q8mm2: tensors with ne[1] > 32768 are always refused by\n"
                       "    // supported_mul_mat and run on CPU, so keep their original (non-tiled) layout.\n"
                       "    if (tensor->ne[1] > 32768 && ggml_hexagon_is_repack_type(tensor->type)) {\n"
                       "        memcpy((char *) tensor->data + offset, data, size);\n"
                       "        return;\n"
                       "    }\n")
              if tsrc.count(s_old) != 1:
                  print("ERROR: q8dbg anchor-2 (set_tensor) not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(s_old, s_new)

              # 3) get_tensor 守卫
              g_old = ('    HEX_VERBOSE("ggml-hex: %s get-tensor %s : data %p offset %zu size %zu\\n", sess->c_name(), tensor->name, data, offset, size);\n')
              g_new = (g_old +
                       "\n"
                       "    // SM8850 q8mm2: mirror of set_tensor guard for CPU-fallback weights.\n"
                       "    if (tensor->ne[1] > 32768 && ggml_hexagon_is_repack_type(tensor->type)) {\n"
                       "        memcpy(data, (const char *) tensor->data + offset, size);\n"
                       "        return;\n"
                       "    }\n")
              if tsrc.count(g_old) != 1:
                  print("ERROR: q8dbg anchor-3 (get_tensor) not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(g_old, g_new)

              # 4) dump_op_supp 提为 INFO
              d_old = 'GGML_LOG_DEBUG("ggml-hex: %s supports-op %s|%s|%s|%s|%s|%s|%s\\n"'
              d_new = 'GGML_LOG_INFO("ggml-hex: %s supports-op %s|%s|%s|%s|%s|%s|%s\\n"'
              if tsrc.count(d_old) != 1:
                  print("ERROR: q8dbg anchor-4 (dump_op_supp) not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(d_old, d_new)

              open(tpath, "w").write(tsrc)
              print("OK: q8dbg applied to ggml-hexagon.cpp (4 sites)")
              raise SystemExit(0)

          print("patch_mode=" + mode + " 不在本 step（B），跳过")
          EOF
          echo "=== patched ADD branch ==="
          grep -n -A 12 "case GGML_OP_ADD:" ggml/src/ggml-hexagon/ggml-hexagon.cpp | head -40 || true
          grep -n "is_row_bcast = false" ggml/src/ggml-hexagon/htp/binary-ops.c || true

      - name: 配置 CMake (启用 Hexagon 后端, v81 架构, 含测试程序)
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DGGML_HEXAGON=ON \
            -DGGML_CPU_ARM_ARCH=armv9.2-a+i8mm+sme2 \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=latest \
            -DHEXAGON_SDK_ROOT=${{ env.HEXAGON_SDK_ROOT }} \
            -DHEXAGON_TOOLS_ROOT=${{ env.HEXAGON_TOOLS_ROOT }} \
            -DHTP_ARCH_VERSION=v81 \
            -DWHISPER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: 开始多线程编译
        run: |
          cd build
          make -j$(nproc)

      # 用与主构建相同的 NDK clang++ 手工编译 llama.cpp 的 test-backend-ops，
      # 链接主构建产出的 libggml*.so（libggml-htp-v81.so 运行时由 dlopen 加载，无需链接）
      - name: Build test-backend-ops (llama.cpp 算子正确性测试)
        run: |
          set -e
          set -x
          echo "=== 下载 test-backend-ops 源码（固定 7-09 commit，匹配 whisper 的 ggml 快照） ==="
          # master 版的测试源码引用了 dsv4_hc / lightning_indexer 等新算子，
          # whisper.cpp 的 ggml 快照（约 7-10）没有这些符号，链接会失败。
          # 故用 2026-07-09 的 commit f84a51940375 版本（q8 hexagon 支持已存在，新算子未引入）。
          SRC=/tmp/test-backend-ops.cpp
          curl -sL --fail https://raw.githubusercontent.com/ggml-org/llama.cpp/f84a5194037564a8231674ee807b3afb4a95a39a/tests/test-backend-ops.cpp -o "$SRC"
          ls -la "$SRC"
          # 与主构建一致：NDK r28 aarch64-linux-android clang++，arm64-v8a，最高 API level
          CXX=$(ls ${{ env.ANDROID_NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android*-clang++ | sort -V | tail -n 1)
          echo "=== 使用编译器: $CXX ==="
          "$CXX" --version
          echo "=== 主构建产出的 ggml 库 ==="
          find build -name "libggml*.so*" | sort
          # 只链接宿主侧库 build/bin/libggml*.so（排除 DSP 侧 libggml-htp-vXX.so，非 aarch64）
          GGML_LIBS=$(find build/bin -maxdepth 1 -name "libggml*.so" | sort | tr '\n' ' ')
          echo "=== 链接库: $GGML_LIBS ==="
          mkdir -p pkg
          "$CXX" -std=c++17 -O2 -fPIC -pthread \
            -I/tmp/llama/ggml/include \
            -I/tmp/llama/ggml/src \
            "$SRC" \
            $GGML_LIBS \
            -Wl,-rpath,'$ORIGIN' \
            -o pkg/test-backend-ops
          echo "=== test-backend-ops 构建完成 ==="
          ls -la pkg/test-backend-ops

      - name: 打包编译产物
        run: |
          mkdir -p pkg
          find build -name "*.so" | xargs -I{} cp {} pkg/
          find build -name "*.so.*" | xargs -I{} cp {} pkg/
          find build -path "*ggml-hexagon*" -name "libggml-htp*.so" -exec cp {} pkg/ \;
          find build/bin -type f -executable | xargs -I{} cp {} pkg/ 2>/dev/null || true
          cd pkg && zip -r ../whisper-hexagon-v81.zip . && cd ..
          echo "=== 打包内容 ==="
          ls -la pkg/

      - name: 上传编译产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: whisper-hexagon-v81-${{ inputs.patch_mode }}-android
          path: whisper-hexagon-v81.zip
          if-no-files-found: error

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v81-${{ inputs.patch_mode }}-build-${{ github.run_number }}
          name: Whisper Hexagon v81 [${{ inputs.patch_mode }}] Build #${{ github.run_number }}
          body: |
            Android Hexagon v81 构建产物 (SM8850)
            补丁模式: ${{ inputs.patch_mode }}

            ## 本版改动
            - 用 llama.cpp 最新 ggml-hexagon 整体覆盖（whisper.cpp 自带版停在 7-10）
            - 新增：L2 缓存一致性重做（dirty bit 跟踪 + 延迟刷写）
            - 新增：hmx-queue 修复、MUL_MAT / FLASH_ATTN 管线优化
            - 新增：WHISPER_BUILD_TESTS=ON，产物含 test-vad 等测试程序
            - patch_mode=${{ inputs.patch_mode }}（none=无补丁 / fp16=非fp32 ADD回退CPU / broadcast=广播ADD回退CPU）

            ## Termux 使用
            ```bash
            export LD_LIBRARY_PATH=.:/vendor/lib64
            ./whisper-cli -m ggml-large-v3-turbo-q8_0.bin -f audio.wav --output-srt
            # 算子正确性测试：
            ./test-backend-ops -b HTP0 -o ADD
            ```
            注意：whisper-cli、libggml*.so、libggml-htp-v81.so 必须整套换新，不要新旧混用
          files: whisper-hexagon-v81.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
