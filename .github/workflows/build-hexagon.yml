                            "    if (!src || src->type != GGML_TYPE_F32 || t->type != GGML_TYPE_F32) {\n"
                            "        return true;\n"
                            "    }\n"
                            "    size_t nel = ggml_nelements(t);\n"
                            "    if (ask) {\n"
