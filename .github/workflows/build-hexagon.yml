                      raise SystemExit(1)
                  wsrc = wsrc.replace(d0_old, d0_new)

                  d1_old = "    sched = ggml_backend_sched_new(backends.data(), nullptr, backends.size(), WHISPER_MAX_NODES, false, true);"
                  d1_new = (d1_old + "\n"
                            "\n"
