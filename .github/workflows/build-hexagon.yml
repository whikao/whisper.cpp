          g_new = ("    if (opt_opstage & HTP_OPSTAGE_QUEUE) {\n"
                   "        // SM8850 gelusync: GELU 留在 NPU 执行, 但在每个 GELU(或任意 unary)后\n"
                   "        // 插入主机同步点, 等 DSP 完成并刷出结果再提交下游算子,\n"
                   "        // 绕过固件异步链上 unary 输出对后续算子不可见的 bug。\n"
                   "        // env GGML_HEXAGON_GELUSYNC: 1=每个 GELU 后同步, 2=每个 unary 后同步\n"
                   "        const char * gs_env = getenv(\"GGML_HEXAGON_GELUSYNC\");\n"
                   "        const int gelusync_mode = gs_env ? atoi(gs_env) : 0;\n"
                   "        for (const auto & node : *nodes_ptr) {\n"
                   "            sess->enqueue_op(node);\n"
                   "            if (gelusync_mode == 1 && node.opcode == HTP_OP_UNARY_GELU) {\n"
                   "                sess->flush();\n"
                   "            } else if (gelusync_mode == 2 && htp_op_is_unary(node.opcode)) {\n"
                   "                sess->flush();\n"
                   "            }\n"
                   "        }\n"
                   "    }\n")
          assert hsrc.count(g_old) == 1, "gelusync anchor 不唯一: %d" % hsrc.count(g_old)
          hsrc = hsrc.replace(g_old, g_new)
          open(hpath, "w").write(hsrc)
          print("OK: gelusync applied")
          EOF
          echo "=== gelusync 补丁验证 ==="
          grep -n -A 14 "SM8850 gelusync" ggml/src/ggml-hexagon/ggml-hexagon.cpp

      - name: 打 geluxact 补丁 (DSP skel GELU 换成精确 erf, 弃用 sigmoid 近似)
        if: inputs.patch_mode == 'geluxact' || inputs.patch_mode == 'rxfix' || inputs.patch_mode == 'gelucpu'
        run: |
          python3 << 'EOF'
          upath = "ggml/src/ggml-hexagon/htp/unary-ops.c"
          usrc = open(upath).read()

          # 现有 DSP skel 把 GELU 实现为 x*sigmoid(1.702x) (GELU_QUICK 近似),
          # 但 ggml-hexagon 把精确的 GGML_UNARY_OP_GELU (erf) 也映射到同一个 HTP op。
          # 在 x∈[-4,-1] 区间相对误差最高 ~77% (max abs 0.0203 @ x=-2.27),
          # 足以污染 encoder/decoder 激活 → 幻听/循环。本补丁换成精确 erf:
          #   erf(z) 用 Abramowitz & Stegun 7.1.26 (|eps| <= 1.5e-7)
          #   gelu(x) = x * 0.5 * (1 + erf(x * 0.70710678f))
          helper = r'''
          // SM8850 geluxact: exact erf GELU (matches ggml GELU reference), not sigmoid approx.
          // erf(z) via Abramowitz & Stegun 7.1.26 (|eps| <= 1.5e-7):
          //   t = 1/(1 + p*|z|); erf(|z|) = 1 - (((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t) * exp(-z*z)
          #define HVX_GX_MUL(a, b)    Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_Vqf32Vsf(Q6_Vqf32_vmpy_VsfVsf(a, b), Q6_V_vzero()))
          #define HVX_GX_FMA(a, b, c) Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_Vqf32Vsf(Q6_Vqf32_vmpy_VsfVsf(a, b), c))

          static inline HVX_Vector hvx_vec_gelu_exact_f32(HVX_Vector x) {
              const HVX_Vector half   = hvx_vec_splat_f32(0.5f);
              const HVX_Vector one    = hvx_vec_splat_f32(1.0f);
              const HVX_Vector zero   = hvx_vec_splat_f32(0.0f);
              const HVX_Vector invsq2 = hvx_vec_splat_f32(0.70710678f);
              const HVX_Vector cp     = hvx_vec_splat_f32(0.3275911f);
              const HVX_Vector a1     = hvx_vec_splat_f32(0.254829592f);
              const HVX_Vector a2     = hvx_vec_splat_f32(-0.284496736f);
              const HVX_Vector a3     = hvx_vec_splat_f32(1.421413741f);
              const HVX_Vector a4     = hvx_vec_splat_f32(-1.453152027f);
              const HVX_Vector a5     = hvx_vec_splat_f32(1.061405429f);

              const HVX_Vector z  = HVX_GX_MUL(x, invsq2);
              const HVX_Vector az = hvx_vec_abs_f32(z);

              const HVX_Vector t = hvx_vec_inverse_f32(HVX_GX_FMA(cp, az, one));

              HVX_Vector poly = HVX_GX_FMA(t, a5, a4);
              poly = HVX_GX_FMA(t, poly, a3);
              poly = HVX_GX_FMA(t, poly, a2);
              poly = HVX_GX_FMA(t, poly, a1);
              poly = HVX_GX_MUL(t, poly);

              const HVX_Vector zz = HVX_GX_MUL(z, z);
              const HVX_Vector e  = hvx_vec_exp_f32(hvx_vec_neg_f32(zz));

              const HVX_Vector erf_abs = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vsub_VsfVsf(one, HVX_GX_MUL(poly, e)));

              const HVX_VectorPred neg = Q6_Q_vcmp_gt_VsfVsf(zero, z);
              const HVX_Vector erf_v   = Q6_V_vmux_QVV(neg, hvx_vec_neg_f32(erf_abs), erf_abs);

              const HVX_Vector r = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_VsfVsf(one, erf_v));
              return HVX_GX_MUL(x, HVX_GX_MUL(half, r));
          }

          #define hvx_gelu_exact_loop_body(dst_type, src_type, vec_store) \
              do {                                                        \
                  dst_type * restrict vdst = (dst_type *) dst;            \
                  src_type * restrict vsrc = (src_type *) src;            \
                                                                          \
                  const uint32_t epv  = 128 / sizeof(float);              \
                  const uint32_t nvec = n / epv;                          \
                  const uint32_t nloe = n % epv;                          \
                                                                          \
                  uint32_t i = 0;                                         \
                                                                          \
                  _Pragma("unroll(4)")                                    \
                  for (; i < nvec; i++) {                                 \
                       vdst[i] = hvx_vec_gelu_exact_f32(vsrc[i]);         \
                  }                                                       \
                  if (nloe) {                                             \
                       HVX_Vector tmp = hvx_vec_gelu_exact_f32(vsrc[i]);  \
                       vec_store((void *) &vdst[i], nloe * sizeof(float), tmp); \
                  }                                                       \
              } while(0)

          static inline void hvx_gelu_exact_f32_aa(uint8_t * restrict dst, const uint8_t * restrict src, uint32_t n) {
              hvx_gelu_exact_loop_body(HVX_Vector, HVX_Vector, hvx_vec_store_a);
          }
          '''

          g1_old = '''// gelu(x) = x * sigmoid(1.702 * x)  (quick/sigmoid approximation, matches CPU GELU_QUICK reference)
          static void gelu_f32(const float * restrict src,
                               float * restrict dst,
                               const uint32_t num_rows,
                               const struct htp_unary_context * uctx) {
              htp_unary_op_preamble;

              for (uint32_t ir = 0; ir < num_rows; ir++) {
                  const uint8_t * restrict src_local = (const uint8_t *)src + (ir * src0_row_size_aligned);
                  uint8_t * restrict dst_local       = (uint8_t *)dst + (ir * dst_row_size_aligned);

                  hvx_mul_scalar_f32(dst_local, src_local, 1.702f, ne0);
                  hvx_sigmoid_f32_aa(dst_local, dst_local, ne0);
                  hvx_mul_f32_aaa(dst_local, src_local, dst_local, ne0);
              }
          }'''
          g1_new = helper + '''
          // gelu(x) = x * 0.5 * (1 + erf(x/sqrt(2)))  (exact erf, matches CPU GELU reference)
          static void gelu_f32(const float * restrict src,
                               float * restrict dst,
                               const uint32_t num_rows,
                               const struct htp_unary_context * uctx) {
              htp_unary_op_preamble;

              for (uint32_t ir = 0; ir < num_rows; ir++) {
                  const uint8_t * restrict src_local = (const uint8_t *)src + (ir * src0_row_size_aligned);
                  uint8_t * restrict dst_local       = (uint8_t *)dst + (ir * dst_row_size_aligned);

                  hvx_gelu_exact_f32_aa(dst_local, src_local, ne0);
              }
          }'''
          assert usrc.count(g1_old) == 1, "geluxact anchor-1 (gelu_f32) 不唯一: %d" % usrc.count(g1_old)
          usrc = usrc.replace(g1_old, g1_new)

          g2_old = '''// gelu(x) = x * sigmoid(1.702 * x)  (quick/sigmoid approximation, matches CPU GELU_QUICK reference)
          static inline void tile_gelu_f32(uint8_t * dst_vtcm, const uint8_t * src_vtcm, uint32_t tw) {
              hvx_mul_scalar_f32(dst_vtcm, src_vtcm, 1.702f, tw);
              hvx_sigmoid_f32_aa(dst_vtcm, dst_vtcm, tw);
              hvx_mul_f32_aaa(dst_vtcm, src_vtcm, dst_vtcm, tw);
          }'''
          g2_new = '''// gelu(x) = x * 0.5 * (1 + erf(x/sqrt(2)))  (exact erf, matches CPU GELU reference)
          static inline void tile_gelu_f32(uint8_t * dst_vtcm, const uint8_t * src_vtcm, uint32_t tw) {
              hvx_gelu_exact_f32_aa(dst_vtcm, src_vtcm, tw);
          }'''
          assert usrc.count(g2_old) == 1, "geluxact anchor-2 (tile_gelu_f32) 不唯一: %d" % usrc.count(g2_old)
          usrc = usrc.replace(g2_old, g2_new)

          open(upath, "w").write(usrc)
          print("OK: geluxact applied (gelu_f32 + tile_gelu_f32 -> exact erf)")
          EOF
          echo "=== geluxact 补丁验证 ==="
          grep -n "geluxact\|hvx_gelu_exact_f32_aa\|sigmoid(1.702" ggml/src/ggml-hexagon/htp/unary-ops.c

      - name: "打 geluff 补丁 (实验: DSP GELU 换 musl/Sun erff HVX 移植, 目标 ~1 ulp, 攻 Bug2 循环阈值)"
        if: inputs.patch_mode == 'geluff'
        run: |
          python3 << 'EOF'
          upath = "ggml/src/ggml-hexagon/htp/unary-ops.c"
          usrc = open(upath).read()

          # geluff: musl/Sun erff 完整移植到 HVX (替代 geluxact 的 A&S 7.1.26)。
          # 动机: Bug2 终判 = DSP GELU 与 CPU 非逐位一致 → v3 q8 深解码链放大 → 19:02 循环。
          # geluxact (A&S 精确 erf, |eps|<=1.5e-7) 把触发面缩到 19:02 一点;
          # geluff 用 CPU 同款 musl erff 算法 (含 Cody-Waite 高精度 exp), 敏感带误差 ~6e-8 (~1 ulp),
          # 赌偏差再降一个量级可以把 19:02 推过混沌阈值。实验路线: 成功则 DSP GELU 全速回血,
          # 失败则退回 gelucpu (GELU 默认 CPU)。float32 仿真: 敏感带 [-4,-1] 最大绝对误差 5.9e-8。
          helper = r'''
          // SM8850 geluff: musl/Sun erff ported to HVX (goal ~1 ulp GELU, Bug2 threshold probe).
          // gelu(x) = x * 0.5 * (1 + erff(x/sqrt(2))), same rounding sequence as CPU musl erff:
          //   |u| < 0.84375         : erf = u + u*pp(z2)/qq(z2), z2 = u*u
          //   0.84375 <= |u| < 1.25 : erfc = (1-erx) - P/Q, s1 = |u|-1
          //   1.25 <= |u|           : erfc = exp(-z*z-0.5625)*exp((z-|u|)(z+|u|)+R/S)/|u|
          //                           z = |u| with low 13 mantissa bits cleared; ra/sa vs rb/sb at |u|=1/0.35
          // exp: Cody-Waite reduction (ln2_hi/ln2_lo) + round-to-nearest + deg-7 Taylor (~1 ulp)
          // div: a * (1/b), reciprocal = magic-seed + 3 Newton iterations (hvx_vec_inverse_f32)
          #define HVX_GF_MUL(a, b)    Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_Vqf32Vsf(Q6_Vqf32_vmpy_VsfVsf(a, b), Q6_V_vzero()))
          #define HVX_GF_FMA(a, b, c) Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_Vqf32Vsf(Q6_Vqf32_vmpy_VsfVsf(a, b), c))

          static inline HVX_Vector hvx_gf_div_f32(HVX_Vector a, HVX_Vector b) {
              return HVX_GF_MUL(a, hvx_vec_inverse_f32(b));
          }

          static __attribute__((noinline)) HVX_Vector hvx_gf_exp_f32(HVX_Vector in_vec) {
              const HVX_Vector log2e = Q6_V_vsplat_R(0x3FB8AA3B);  // log2(e) = 1.4426950408
              const HVX_Vector half  = Q6_V_vsplat_R(0x3F000000);  // 0.5
              const HVX_Vector c1    = Q6_V_vsplat_R(0x3F317000);  // ln2_hi = 0.693359375
              const HVX_Vector c2    = Q6_V_vsplat_R(0xB95E8083);  // ln2_lo = -2.12194440e-4
              const HVX_Vector zero  = Q6_V_vzero();

              // clamp to (-88, 88) to avoid overflow/underflow
              HVX_VectorPred pr = Q6_Q_vcmp_gt_VsfVsf(in_vec, Q6_V_vsplat_R(0x42B17218));
              HVX_VectorPred pl = Q6_Q_vcmp_gt_VsfVsf(Q6_V_vsplat_R(0xC2B00000), in_vec);
              in_vec = Q6_V_vmux_QVV(pr, Q6_V_vsplat_R(0x42B17218), in_vec);
              in_vec = Q6_V_vmux_QVV(pl, Q6_V_vsplat_R(0xC2B00000), in_vec);

              // n = round(x/ln2) = floor(x*log2e + 0.5)
              HVX_Vector t2  = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_Vqf32Vsf(Q6_Vqf32_vmpy_VsfVsf(log2e, in_vec), half));
              HVX_Vector f_v = hvx_vec_floor_f32(t2);
              HVX_Vector k_v = hvx_vec_truncate_f32(f_v);

              // Cody-Waite: g = x - n*ln2_hi - n*ln2_lo (ln2_lo is negative)
              HVX_Vector g_q = Q6_Vqf32_vadd_VsfVsf(in_vec, zero);
              g_q = Q6_Vqf32_vsub_Vqf32Vqf32(g_q, Q6_Vqf32_vmpy_VsfVsf(f_v, c1));
              g_q = Q6_Vqf32_vsub_Vqf32Vqf32(g_q, Q6_Vqf32_vmpy_VsfVsf(f_v, c2));
              g_q = Q6_Vqf32_vadd_Vqf32Vsf(g_q, zero);
              HVX_Vector g_v = Q6_Vsf_equals_Vqf32(g_q);

              HVX_Vector z_q = Q6_Vqf32_vmpy_Vqf32Vqf32(g_q, g_q);
              z_q = Q6_Vqf32_vadd_Vqf32Vsf(z_q, zero);

              // y = 1 + g + z*(E0 + g*(E1 + g*(E2 + g*(E3 + g*(E4 + g*E5))))), Ei = 1/(i+2)!
              HVX_Vector y = Q6_Vqf32_vmpy_VsfVsf(Q6_V_vsplat_R(0x39506967), g_v);   // E5*g
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, Q6_V_vsplat_R(0x3AB743CE));              // +E4
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, zero);
              y = Q6_Vqf32_vmpy_Vqf32Vqf32(y, g_q);
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, Q6_V_vsplat_R(0x3C088908));              // +E3
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, zero);
              y = Q6_Vqf32_vmpy_Vqf32Vqf32(y, g_q);
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, Q6_V_vsplat_R(0x3D2AA9C1));              // +E2
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, zero);
              y = Q6_Vqf32_vmpy_Vqf32Vqf32(y, g_q);
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, Q6_V_vsplat_R(0x3E2AAAAA));              // +E1
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, zero);
              y = Q6_Vqf32_vmpy_Vqf32Vqf32(y, g_q);
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, Q6_V_vsplat_R(0x3F000000));              // +E0
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, zero);
              y = Q6_Vqf32_vmpy_Vqf32Vqf32(y, z_q);                                  // *z
              y = Q6_Vqf32_vadd_Vqf32Vqf32(y, g_q);                                  // +g
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, zero);
              y = Q6_Vqf32_vadd_Vqf32Vsf(y, Q6_V_vsplat_R(0x3f800000));              // +1.0
              y = Q6_Vsf_equals_Vqf32(y);

              // y = ldexpf(y, k): add k to the exponent field
              HVX_Vector y_exp = Q6_Vw_vasl_VwR(y, 1);
              y_exp = Q6_Vuw_vlsr_VuwR(y_exp, IEEE_VSF_MANTLEN + 1);
              y_exp = Q6_Vw_vadd_VwVw(k_v, y_exp);
              HVX_VectorPred q_under = Q6_Q_vcmp_gt_VwVw(zero, y_exp);
              y = Q6_Vw_vaslacc_VwVwR(y, k_v, IEEE_VSF_MANTLEN);
              return Q6_V_vmux_QVV(q_under, zero, y);
          }


          static __attribute__((noinline)) HVX_Vector hvx_vec_gelu_musl_f32(HVX_Vector x) {
              const HVX_Vector one  = hvx_vec_splat_f32(1.0f);
              const HVX_Vector half = hvx_vec_splat_f32(0.5f);
              const HVX_Vector erx  = hvx_vec_splat_f32(8.4506291151e-01f);
              const HVX_Vector u    = HVX_GF_MUL(x, hvx_vec_splat_f32(0.70710678f));
              const HVX_Vector a    = hvx_vec_abs_f32(u);
              const HVX_VectorPred q_neg = Q6_Q_vcmp_gt_VsfVsf(Q6_V_vzero(), u);

              // ---- small: |u| < 0.84375, erf(u) = u + u*r/s (signed, odd function)
              const HVX_Vector z2 = HVX_GF_MUL(u, u);
              HVX_Vector r = hvx_vec_splat_f32(-2.3763017452e-05f);   // pp4
              r = HVX_GF_FMA(z2, r, hvx_vec_splat_f32(-5.7702702470e-03f));
              r = HVX_GF_FMA(z2, r, hvx_vec_splat_f32(-2.8481749818e-02f));
              r = HVX_GF_FMA(z2, r, hvx_vec_splat_f32(-3.2504209876e-01f));
              r = HVX_GF_FMA(z2, r, hvx_vec_splat_f32( 1.2837916613e-01f)); // pp0
              HVX_Vector s = hvx_vec_splat_f32(-3.9602282413e-06f);   // qq5
              s = HVX_GF_FMA(z2, s, hvx_vec_splat_f32( 1.3249473704e-04f));
              s = HVX_GF_FMA(z2, s, hvx_vec_splat_f32( 5.0813062117e-03f));
              s = HVX_GF_FMA(z2, s, hvx_vec_splat_f32( 6.5022252500e-02f));
              s = HVX_GF_FMA(z2, s, hvx_vec_splat_f32( 3.9791721106e-01f));
              s = HVX_GF_FMA(z2, s, one);
              const HVX_Vector erf_small = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_Vqf32Vsf(HVX_GF_MUL(u, hvx_gf_div_f32(r, s)), u));
              const HVX_Vector h_small   = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_VsfVsf(one, erf_small));

              // ---- mid: 0.84375 <= |u| < 1.25, erfc = (1-erx) - P/Q, s1 = |u|-1
              const HVX_Vector s1 = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vsub_VsfVsf(a, one));
              HVX_Vector P = hvx_vec_splat_f32(-2.1663755178e-03f);   // pa6
              P = HVX_GF_FMA(s1, P, hvx_vec_splat_f32( 3.5478305072e-02f));
              P = HVX_GF_FMA(s1, P, hvx_vec_splat_f32(-1.1089469492e-01f));
              P = HVX_GF_FMA(s1, P, hvx_vec_splat_f32( 3.1834661961e-01f));
              P = HVX_GF_FMA(s1, P, hvx_vec_splat_f32(-3.7220788002e-01f));
              P = HVX_GF_FMA(s1, P, hvx_vec_splat_f32( 4.1485610604e-01f));
              P = HVX_GF_FMA(s1, P, hvx_vec_splat_f32(-2.3621185683e-03f)); // pa0
              HVX_Vector Q = hvx_vec_splat_f32( 1.1984500103e-02f);   // qa6
              Q = HVX_GF_FMA(s1, Q, hvx_vec_splat_f32( 1.3637083583e-02f));
              Q = HVX_GF_FMA(s1, Q, hvx_vec_splat_f32( 1.2617121637e-01f));
              Q = HVX_GF_FMA(s1, Q, hvx_vec_splat_f32( 7.1828655899e-02f));
              Q = HVX_GF_FMA(s1, Q, hvx_vec_splat_f32( 5.4039794207e-01f));
              Q = HVX_GF_FMA(s1, Q, hvx_vec_splat_f32( 1.0642088205e-01f));
              Q = HVX_GF_FMA(s1, Q, one);
              const HVX_Vector erfc_mid = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vsub_VsfVsf(
                  Q6_Vsf_equals_Vqf32(Q6_Vqf32_vsub_VsfVsf(one, erx)), hvx_gf_div_f32(P, Q)));

              // ---- tail: |u| >= 1.25, erfc = exp(-z*z-0.5625)*exp((z-a)(z+a)+R/S)/a
              const HVX_Vector inv_aa = hvx_vec_inverse_f32(HVX_GF_MUL(a, a));   // 1/(a*a)
              HVX_Vector Ra = hvx_vec_splat_f32(-9.8143291473e+00f);  // ra7
              Ra = HVX_GF_FMA(inv_aa, Ra, hvx_vec_splat_f32(-8.1287437439e+01f));
              Ra = HVX_GF_FMA(inv_aa, Ra, hvx_vec_splat_f32(-1.8460508728e+02f));
              Ra = HVX_GF_FMA(inv_aa, Ra, hvx_vec_splat_f32(-1.6239666748e+02f));
              Ra = HVX_GF_FMA(inv_aa, Ra, hvx_vec_splat_f32(-6.2375331879e+01f));
              Ra = HVX_GF_FMA(inv_aa, Ra, hvx_vec_splat_f32(-1.0558626175e+01f));
              Ra = HVX_GF_FMA(inv_aa, Ra, hvx_vec_splat_f32(-6.9385856390e-01f));
              Ra = HVX_GF_FMA(inv_aa, Ra, hvx_vec_splat_f32(-9.8649440333e-03f)); // ra0
              HVX_Vector Sa = hvx_vec_splat_f32(-6.0424413532e-02f);  // sa8
              Sa = HVX_GF_FMA(inv_aa, Sa, hvx_vec_splat_f32( 6.5702495575e+00f));
              Sa = HVX_GF_FMA(inv_aa, Sa, hvx_vec_splat_f32( 1.0863500214e+02f));
              Sa = HVX_GF_FMA(inv_aa, Sa, hvx_vec_splat_f32( 4.2900814819e+02f));
              Sa = HVX_GF_FMA(inv_aa, Sa, hvx_vec_splat_f32( 6.4538726807e+02f));
              Sa = HVX_GF_FMA(inv_aa, Sa, hvx_vec_splat_f32( 4.3456588745e+02f));
              Sa = HVX_GF_FMA(inv_aa, Sa, hvx_vec_splat_f32( 1.3765776062e+02f));
              Sa = HVX_GF_FMA(inv_aa, Sa, hvx_vec_splat_f32( 1.9651271820e+01f));
              Sa = HVX_GF_FMA(inv_aa, Sa, one);
              HVX_Vector Rb = hvx_vec_splat_f32(-4.8351919556e+02f);  // rb6
              Rb = HVX_GF_FMA(inv_aa, Rb, hvx_vec_splat_f32(-1.0250950928e+03f));
              Rb = HVX_GF_FMA(inv_aa, Rb, hvx_vec_splat_f32(-6.3756646729e+02f));
              Rb = HVX_GF_FMA(inv_aa, Rb, hvx_vec_splat_f32(-1.6063638306e+02f));
              Rb = HVX_GF_FMA(inv_aa, Rb, hvx_vec_splat_f32(-1.7757955551e+01f));
              Rb = HVX_GF_FMA(inv_aa, Rb, hvx_vec_splat_f32(-7.9928326607e-01f));
              Rb = HVX_GF_FMA(inv_aa, Rb, hvx_vec_splat_f32(-9.8649431020e-03f)); // rb0
              HVX_Vector Sb = hvx_vec_splat_f32(-2.2440952301e+01f);  // sb7
              Sb = HVX_GF_FMA(inv_aa, Sb, hvx_vec_splat_f32( 4.7452853394e+02f));
              Sb = HVX_GF_FMA(inv_aa, Sb, hvx_vec_splat_f32( 2.5530502930e+03f));
              Sb = HVX_GF_FMA(inv_aa, Sb, hvx_vec_splat_f32( 3.1998581543e+03f));
              Sb = HVX_GF_FMA(inv_aa, Sb, hvx_vec_splat_f32( 1.5367296143e+03f));
              Sb = HVX_GF_FMA(inv_aa, Sb, hvx_vec_splat_f32( 3.2579251099e+02f));
              Sb = HVX_GF_FMA(inv_aa, Sb, hvx_vec_splat_f32( 3.0338060379e+01f));
              Sb = HVX_GF_FMA(inv_aa, Sb, one);
              const HVX_VectorPred q_low = Q6_Q_vcmp_gt_VsfVsf(hvx_vec_splat_f32(2.8571428571f), a);  // a < 1/0.35
              const HVX_Vector R = Q6_V_vmux_QVV(q_low, Ra, Rb);
              const HVX_Vector S = Q6_V_vmux_QVV(q_low, Sa, Sb);
              const HVX_Vector z = Q6_V_vand_VV(a, Q6_V_vsplat_R(0xffffe000));  // pseudo-single precision
              const HVX_Vector arg1 = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vsub_VsfVsf(
                  hvx_vec_neg_f32(HVX_GF_MUL(z, z)), hvx_vec_splat_f32(0.5625f)));
              const HVX_Vector zma = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vsub_VsfVsf(z, a));
              const HVX_Vector zpa = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_VsfVsf(z, a));
              const HVX_Vector arg2 = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_Vqf32Vsf(
                  Q6_Vqf32_vmpy_VsfVsf(zma, zpa), hvx_gf_div_f32(R, S)));
              const HVX_Vector erfc_tail = hvx_gf_div_f32(
                  HVX_GF_MUL(hvx_gf_exp_f32(arg1), hvx_gf_exp_f32(arg2)), a);

              // y = 1 - erfc = |erf(u)| (same rounding sequence as musl erff); h = 1 + erf(u)
              const HVX_Vector erfc_v = Q6_V_vmux_QVV(
                  Q6_Q_vcmp_gt_VsfVsf(hvx_vec_splat_f32(1.25f), a), erfc_mid, erfc_tail);
              const HVX_Vector y = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vsub_VsfVsf(one, erfc_v));
              const HVX_Vector h_ge = Q6_Vsf_equals_Vqf32(Q6_Vqf32_vadd_VsfVsf(one,
                  Q6_V_vmux_QVV(q_neg, hvx_vec_neg_f32(y), y)));
              const HVX_Vector h = Q6_V_vmux_QVV(
                  Q6_Q_vcmp_gt_VsfVsf(hvx_vec_splat_f32(0.84375f), a), h_small, h_ge);

              return HVX_GF_MUL(x, HVX_GF_MUL(half, h));
          }

          #define hvx_gelu_musl_loop_body(dst_type, src_type, vec_store)         \
              do {                                                               \
                  dst_type * restrict vdst = (dst_type *) dst;                   \
                  src_type * restrict vsrc = (src_type *) src;                   \
                                                                                 \
                  const uint32_t epv  = 128 / sizeof(float);                     \
                  const uint32_t nvec = n / epv;                                 \
                  const uint32_t nloe = n % epv;                                 \
                                                                                 \
                  uint32_t i = 0;                                                \
                                                                                 \
                  _Pragma("unroll(4)")                                           \
                  for (; i < nvec; i++) {                                        \
                       vdst[i] = hvx_vec_gelu_musl_f32(vsrc[i]);                 \
                  }                                                              \
                  if (nloe) {                                                    \
                       HVX_Vector tmp = hvx_vec_gelu_musl_f32(vsrc[i]);          \
                       vec_store((void *) &vdst[i], nloe * sizeof(float), tmp);  \
                  }                                                              \
              } while(0)

          static inline void hvx_gelu_musl_f32_aa(uint8_t * restrict dst, const uint8_t * restrict src, uint32_t n) {
              hvx_gelu_musl_loop_body(HVX_Vector, HVX_Vector, hvx_vec_store_a);
          }
          '''

          g1_old = '''// gelu(x) = x * sigmoid(1.702 * x)  (quick/sigmoid approximation, matches CPU GELU_QUICK reference)
          static void gelu_f32(const float * restrict src,
                               float * restrict dst,
                               const uint32_t num_rows,
                               const struct htp_unary_context * uctx) {
              htp_unary_op_preamble;

              for (uint32_t ir = 0; ir < num_rows; ir++) {
                  const uint8_t * restrict src_local = (const uint8_t *)src + (ir * src0_row_size_aligned);
                  uint8_t * restrict dst_local       = (uint8_t *)dst + (ir * dst_row_size_aligned);

                  hvx_mul_scalar_f32(dst_local, src_local, 1.702f, ne0);
                  hvx_sigmoid_f32_aa(dst_local, dst_local, ne0);
                  hvx_mul_f32_aaa(dst_local, src_local, dst_local, ne0);
              }
          }'''
          g1_new = helper + '''
          // gelu(x) = x * 0.5 * (1 + erf(x/sqrt(2)))  (musl/Sun erff HVX port, matches CPU musl erff ~1 ulp)
          static void gelu_f32(const float * restrict src,
                               float * restrict dst,
                               const uint32_t num_rows,
                               const struct htp_unary_context * uctx) {
              htp_unary_op_preamble;

              for (uint32_t ir = 0; ir < num_rows; ir++) {
                  const uint8_t * restrict src_local = (const uint8_t *)src + (ir * src0_row_size_aligned);
                  uint8_t * restrict dst_local       = (uint8_t *)dst + (ir * dst_row_size_aligned);

                  hvx_gelu_musl_f32_aa(dst_local, src_local, ne0);
              }
          }'''
          assert usrc.count(g1_old) == 1, "geluff anchor-1 (gelu_f32) 不唯一: %d" % usrc.count(g1_old)
          usrc = usrc.replace(g1_old, g1_new)

          g2_old = '''// gelu(x) = x * sigmoid(1.702 * x)  (quick/sigmoid approximation, matches CPU GELU_QUICK reference)
          static inline void tile_gelu_f32(uint8_t * dst_vtcm, const uint8_t * src_vtcm, uint32_t tw) {
              hvx_mul_scalar_f32(dst_vtcm, src_vtcm, 1.702f, tw);
              hvx_sigmoid_f32_aa(dst_vtcm, dst_vtcm, tw);
              hvx_mul_f32_aaa(dst_vtcm, src_vtcm, dst_vtcm, tw);
          }'''
          g2_new = '''// gelu(x) = x * 0.5 * (1 + erf(x/sqrt(2)))  (musl/Sun erff HVX port, matches CPU musl erff ~1 ulp)
          static inline void tile_gelu_f32(uint8_t * dst_vtcm, const uint8_t * src_vtcm, uint32_t tw) {
              hvx_gelu_musl_f32_aa(dst_vtcm, src_vtcm, tw);
          }'''
          assert usrc.count(g2_old) == 1, "geluff anchor-2 (tile_gelu_f32) 不唯一: %d" % usrc.count(g2_old)
          usrc = usrc.replace(g2_old, g2_new)

          open(upath, "w").write(usrc)
          print("OK: geluff applied (gelu_f32 + tile_gelu_f32 -> musl/Sun erff HVX)")
          EOF
          echo "=== geluff 补丁验证 ==="
          grep -n "geluff\|hvx_gelu_musl_f32_aa\|sigmoid(1.702" ggml/src/ggml-hexagon/htp/unary-ops.c

      - name: "打 reorderfix 补丁 (Bug2 根治: 修 graph_optimize_reorder 不安全 matmul 堆叠 + GGML_HEXAGON_REORDER 开关)"
        if: inputs.patch_mode == 'rxfix' || inputs.patch_mode == 'gelucpu'
        run: |
          python3 - << 'EOF'
          tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
          tsrc = open(tpath).read()

          # 1) 声明 opt_reorder
          a1_old = "static int opt_opfusion = 1;    // enable/disable op fusion"
          a1_new = a1_old + "\nstatic int opt_reorder  = 1;    // SM8850 rxfix: enable/disable matmul stacking reorder (GGML_HEXAGON_REORDER)"
          assert tsrc.count(a1_old) == 1, "rxfix anchor-1 (opt decl) 不唯一"
          tsrc = tsrc.replace(a1_old, a1_new)

          # 2) 依赖安全检查函数 + 插入点
          a2_old = ("    // Wait until all pending ops complete\n"
                    "    sess->flush();\n"
                    "\n"
                    "    return GGML_STATUS_SUCCESS;\n"
                    "}\n"
                    "\n"
                    "static void ggml_backend_hexagon_synchronize")
          safe_fn = ("    // Wait until all pending ops complete\n"
                    "    sess->flush();\n"
                    "\n"
                    "    return GGML_STATUS_SUCCESS;\n"
                    "}\n"
                    "\n"
                    "// SM8850 rxfix: stacking node1 right after node0 is only safe if no node\n"
                    "// between them reads node1's outputs (would run before its producer) or\n"
                    "// produces any of node0/node1's inputs (stacked matmul reads stale data).\n"
                    "static bool ggml_hexagon_reorder_stack_safe(const std::vector<htp_opnode> & nodes,\n"
                    "                                            const std::vector<bool> & used,\n"
                    "                                            int i0, int i1) {\n"
                    "    const auto & node0 = nodes[i0];\n"
                    "    const auto & node1 = nodes[i1];\n"
                    "    const auto outs1 = node1.get_outputs();\n"
                    "    const auto ins0  = node0.get_inputs();\n"
                    "    const auto ins1  = node1.get_inputs();\n"
                    "    for (int k = i0 + 1; k < i1; k++) {\n"
                    "        if (used[k]) {\n"
                    "            continue;\n"
                    "        }\n"
                    "        const auto mid_ins  = nodes[k].get_inputs();\n"
                    "        const auto mid_outs = nodes[k].get_outputs();\n"
                    "        for (const auto * x : mid_ins) {\n"
                    "            for (const auto * o : outs1) {\n"
                    "                if (x == o) return false;\n"
                    "            }\n"
                    "        }\n"
                    "        for (const auto * x : mid_outs) {\n"
                    "            for (const auto * in : ins0) {\n"
                    "                if (x == in) return false;\n"
                    "            }\n"
                    "            for (const auto * in : ins1) {\n"
                    "                if (x == in) return false;\n"
                    "            }\n"
                    "        }\n"
                    "    }\n"
                    "    return true;\n"
                    "}\n"
                    "\n"
                    "static void ggml_backend_hexagon_synchronize")
          assert tsrc.count(a2_old) == 1, "rxfix anchor-2 (insert safe fn) 不唯一"
          tsrc = tsrc.replace(a2_old, safe_fn)

          # 3) REORDER=0 整体禁用出口（身份序）
          a3_old = "    std::vector<bool> used(n, false);\n"
          a3_new = ("    std::vector<bool> used(n, false);\n"
                    "\n"
                    "    if (!opt_reorder) {\n"
                    "        // SM8850 rxfix: GGML_HEXAGON_REORDER=0 -> identity order, no stacking (A/B debug)\n"
                    "        for (int i = 0; i < n; i++) {\n"
                    "            res.push_back(i);\n"
                    "        }\n"
                    "        return res;\n"
                    "    }\n")
          # a3 只应出现在 reorder 函数里
          assert tsrc.count(a3_old) == 1, "rxfix anchor-3 (used decl) 不唯一: %d" % tsrc.count(a3_old)
          tsrc = tsrc.replace(a3_old, a3_new)

          # 4) 堆叠前加安全检查
          a4_old = "            if (node1.stackable() && node1.same_input(node0)) {"
          a4_new = ("            if (node1.stackable() && node1.same_input(node0)) {\n"
                    "                if (!ggml_hexagon_reorder_stack_safe(nodes, used, i0, i1)) {\n"
                    "                    continue; // SM8850 rxfix: unsafe stacking would execute node1 before a producer/consumer\n"
                    "                }")
          assert tsrc.count(a4_old) == 1, "rxfix anchor-4 (stackable check) 不唯一"
          tsrc = tsrc.replace(a4_old, a4_new)

          # 5) env 解析声明
          a5_old = '    const char * str_opfusion = getenv("GGML_HEXAGON_OPFUSION");'
          a5_new = a5_old + '\n    const char * str_reorder  = getenv("GGML_HEXAGON_REORDER"); // SM8850 rxfix'
          assert tsrc.count(a5_old) == 1, "rxfix anchor-5 (env decl) 不唯一"
          tsrc = tsrc.replace(a5_old, a5_new)

          # 6) env 解析赋值
          a6_old = "    opt_opfusion  = str_opfusion ? atoi(str_opfusion)                     : opt_opfusion;"
          a6_new = a6_old + "\n    opt_reorder   = str_reorder  ? atoi(str_reorder)                      : opt_reorder; // SM8850 rxfix"
          assert tsrc.count(a6_old) >= 1, "rxfix anchor-6 (env assign) 未找到"
          tsrc = tsrc.replace(a6_old, a6_new, 1)

          open(tpath, "w").write(tsrc)
          print("OK: rxfix applied (6 anchors)")
          EOF
          echo "=== rxfix 补丁验证 ==="
          grep -n "SM8850 rxfix" ggml/src/ggml-hexagon/ggml-hexagon.cpp

      - name: "打 gelucpu 补丁 (Bug2 根治: GELU 默认不上 DSP, GGML_HEXAGON_GELU_DSP=1 可开)"
        if: inputs.patch_mode == 'gelucpu'
        run: |
          python3 - << 'EOF'
          tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
          tsrc = open(tpath).read()

          # Bug2 终判: v3 q8 长解码链对 DSP GELU 与 CPU 的逐位差异混沌级敏感,
          # 任何非逐位一致的 GELU (sigmoid 近似或 1e-7 级精确 erf) 都会在脆弱
          # 窗口确定性触发循环; HVX 逐位复刻 CPU erff 不现实。
          # 根治: GELU/GELU_QUICK 默认拒上 DSP (等效内建 OPFILTER='.*GELU.*'),
          # turbo/fp16 已验证 DSP GELU 干净, 用 GGML_HEXAGON_GELU_DSP=1 显式开启。
          g_old = ("                case GGML_UNARY_OP_GELU:\n"
                   "                case GGML_UNARY_OP_GELU_QUICK:\n"
                   "                    supp = ggml_hexagon_supported_unary(sess, op);\n"
                   "                    break;")
          g_new = ("                case GGML_UNARY_OP_GELU:\n"
                   "                case GGML_UNARY_OP_GELU_QUICK:\n"
                   "                    // SM8850 gelucpu: GELU defaults to CPU (Bug2);\n"
                   "                    // GGML_HEXAGON_GELU_DSP=1 opts back into DSP GELU.\n"
                   "                    supp = getenv(\"GGML_HEXAGON_GELU_DSP\") ?\n"
                   "                           ggml_hexagon_supported_unary(sess, op) : false;\n"
                   "                    break;")
          assert tsrc.count(g_old) == 1, "gelucpu anchor (UNARY GELU case) 不唯一: %d" % tsrc.count(g_old)
          tsrc = tsrc.replace(g_old, g_new)

          open(tpath, "w").write(tsrc)
          print("OK: gelucpu applied (GELU default->CPU, GGML_HEXAGON_GELU_DSP=1 opt-in)")
          EOF
          echo "=== gelucpu 补丁验证 ==="
          grep -n -A 3 "SM8850 gelucpu" ggml/src/ggml-hexagon/ggml-hexagon.cpp

      - name: 安装 glslc (hybrid 模式的 Vulkan shader 编译器)
        if: inputs.patch_mode == 'hybrid'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslc glslang-tools spirv-headers spirv-tools
          glslc --version
          glslangValidator --version
          # apt 的 spirv-headers 不带 CMake config, 从源码装一份供 find_package 使用
          if ! ls /usr/lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake /usr/local/lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake 2>/dev/null; then
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
            cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build -DCMAKE_BUILD_TYPE=Release
            sudo cmake --install /tmp/spirv-headers/build
          fi
          # 找出 config 的真实安装路径, 显式传给后面的 CMake 配置步骤
          CFG_DIR=$(sudo find /usr /usr/local -name 'SPIRV-HeadersConfig.cmake' 2>/dev/null | head -1 | xargs dirname)
          echo "SPIRV-Headers config dir: $CFG_DIR"
          test -n "$CFG_DIR"
          echo "SPIRV_HEADERS_DIR=$CFG_DIR" >> "$GITHUB_ENV"
          # NDK 只有 vulkan.h 没有 vulkan.hpp (Vulkan-Hpp), 从官方仓库取完整头文件
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          test -f /tmp/vulkan-headers/include/vulkan/vulkan.hpp
          echo "VULKAN_HEADERS_INCLUDE=/tmp/vulkan-headers/include" >> "$GITHUB_ENV"
          # SPIRV 头文件也要显式给交叉编译器 (NDK 不搜 /usr/local/include)
          if [ ! -f /tmp/spirv-headers/include/spirv/unified1/spirv.hpp ]; then
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          fi
          echo "SPIRV_HEADERS_INCLUDE=/tmp/spirv-headers/include" >> "$GITHUB_ENV"

      - name: 配置 CMake (启用 Hexagon 后端, v81 架构, 含测试程序)
        run: |
          mkdir -p build && cd build
          VULKAN_FLAG=""
          if [ "${{ inputs.patch_mode }}" = "hybrid" ]; then
            VULKAN_FLAG="-DGGML_VULKAN=ON -DSPIRV-Headers_DIR=${{ env.SPIRV_HEADERS_DIR }} -DVulkan_INCLUDE_DIR=${{ env.VULKAN_HEADERS_INCLUDE }} -DCMAKE_CXX_FLAGS=-I${{ env.SPIRV_HEADERS_INCLUDE }}"
            echo "=== hybrid 模式: Hexagon + Vulkan 双后端 ==="
          fi
          cmake .. \
            -DGGML_HEXAGON=ON \
            $VULKAN_FLAG \
            -DGGML_CPU_ARM_ARCH=armv9.2-a+i8mm+sme2 \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=latest \
            -DHEXAGON_SDK_ROOT=${{ env.HEXAGON_SDK_ROOT }} \
            -DHEXAGON_TOOLS_ROOT=${{ env.HEXAGON_TOOLS_ROOT }} \
            -DHTP_ARCH_VERSION=v81 \
            -DWHISPER_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: 开始多线程编译
        run: |
          cd build
          make -j$(nproc)

      # 用与主构建相同的 NDK clang++ 手工编译 llama.cpp 的 test-backend-ops，
      # 链接主构建产出的 libggml*.so（libggml-htp-v81.so 运行时由 dlopen 加载，无需链接）
      - name: Build test-backend-ops (llama.cpp 算子正确性测试)
        run: |
          set -e
          set -x
          echo "=== 下载 test-backend-ops 源码（固定 7-09 commit，匹配 whisper 的 ggml 快照） ==="
          # master 版的测试源码引用了 dsv4_hc / lightning_indexer 等新算子，
          # whisper.cpp 的 ggml 快照（约 7-10）没有这些符号，链接会失败。
          # 故用 2026-07-09 的 commit f84a51940375 版本（q8 hexagon 支持已存在，新算子未引入）。
          SRC=/tmp/test-backend-ops.cpp
          curl -sL --fail https://raw.githubusercontent.com/ggml-org/llama.cpp/f84a5194037564a8231674ee807b3afb4a95a39a/tests/test-backend-ops.cpp -o "$SRC"
          ls -la "$SRC"
          # 与主构建一致：NDK r28 aarch64-linux-android clang++，arm64-v8a，最高 API level
          CXX=$(ls ${{ env.ANDROID_NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android*-clang++ | sort -V | tail -n 1)
          echo "=== 使用编译器: $CXX ==="
          "$CXX" --version
          echo "=== 主构建产出的 ggml 库 ==="
          find build -name "libggml*.so*" | sort
          # 只链接宿主侧库 build/bin/libggml*.so（排除 DSP 侧 libggml-htp-vXX.so，非 aarch64）
          GGML_LIBS=$(find build/bin -maxdepth 1 -name "libggml*.so" | sort | tr '\n' ' ')
          echo "=== 链接库: $GGML_LIBS ==="
          mkdir -p pkg
          "$CXX" -std=c++17 -O2 -fPIC -pthread \
            -I/tmp/llama/ggml/include \
            -I/tmp/llama/ggml/src \
            "$SRC" \
            $GGML_LIBS \
            -Wl,-rpath,'$ORIGIN' \
            -o pkg/test-backend-ops
          echo "=== test-backend-ops 构建完成 ==="
          ls -la pkg/test-backend-ops

      # gelu-sweep: whisper 真实形状/幅度下的 GELU 精度扫频(HTP vs double 参考)
      - name: Build gelu-sweep (GELU 精度扫频探针)
        run: |
          set -e
          SRC=/tmp/gelu-sweep.cpp
          cat > "$SRC" <<'CPEOF'
          // gelu-sweep: probe HTP GELU accuracy at whisper-realistic shapes and input scales.
          // Compares HTP output against a double-precision erf reference computed on host.
          // Usage: ./gelu-sweep   (set GGML_HEXAGON_OPFUSION=1 externally to test fused path)
          #include "ggml.h"
          #include "ggml-backend.h"
          #include <cmath>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <vector>
          #include <random>

          static double gelu_ref(double x) {
              return 0.5 * x * (1.0 + std::erf(x / std::sqrt(2.0)));
          }

          // with_matmul=false: out = gelu(x),            x: [d0, d1]
          // with_matmul=true : out = gelu(w @ x + bias), x: [din, d1], w: [din, d0], din = d0/4
          static void run_case(ggml_backend_t be, const char * tag, int64_t d0, int64_t d1,
                               float scale, int mode) {
              const bool with_matmul = mode > 0;
              const int64_t din = with_matmul ? d0/4 : d0;
              const int64_t ne_in = din * d1;
              std::mt19937 rng(1234);
              std::uniform_real_distribution<float> ud(-1.f, 1.f);
              std::vector<float> x(ne_in);
              for (auto & v : x) v = ud(rng) * scale;

              struct ggml_init_params ip = { (size_t)512*1024*1024, nullptr, true };
              ggml_context * ctx = ggml_init(ip);

              ggml_tensor * inp = ggml_new_tensor_2d(ctx, GGML_TYPE_F32, din, d1);
              ggml_tensor * wt  = nullptr;
              ggml_tensor * bt  = nullptr;
              ggml_tensor * cur = inp;
              if (with_matmul) {
                  wt  = ggml_new_tensor_2d(ctx, mode == 2 ? GGML_TYPE_Q8_0 : GGML_TYPE_F32, din, d0);
                  bt  = ggml_new_tensor_1d(ctx, GGML_TYPE_F32, d0);
                  cur = ggml_add(ctx, ggml_mul_mat(ctx, wt, inp), bt);
              }
              ggml_tensor * out = ggml_gelu(ctx, cur);
              ggml_cgraph * gf = ggml_new_graph(ctx);
              ggml_build_forward_expand(gf, out);

              ggml_backend_buffer_t buf = ggml_backend_alloc_ctx_tensors(ctx, be);
              if (!buf) { printf("%-28s alloc FAILED\n", tag); ggml_free(ctx); return; }

              ggml_backend_tensor_set(inp, x.data(), 0, ggml_nbytes(inp));
              std::vector<float> wd, bd;
              if (with_matmul) {
                  wd.resize(din * d0);
                  bd.resize(ggml_nelements(bt));
                  std::normal_distribution<float> nd(0.f, 0.05f);
                  for (auto & v : wd) v = nd(rng);
                  for (auto & v : bd) v = nd(rng);
                  if (mode == 2) {
                      std::vector<char> qd(ggml_nbytes(wt));
                      ggml_quantize_chunk(GGML_TYPE_Q8_0, wd.data(), qd.data(), 0, d0, din, nullptr);
                      ggml_backend_tensor_set(wt, qd.data(), 0, qd.size());
                  } else {
                      ggml_backend_tensor_set(wt, wd.data(), 0, ggml_nbytes(wt));
                  }
                  ggml_backend_tensor_set(bt, bd.data(), 0, ggml_nbytes(bt));
              }

              if (ggml_backend_graph_compute(be, gf) != GGML_STATUS_SUCCESS) {
                  printf("%-28s compute FAILED\n", tag);
                  ggml_backend_buffer_free(buf); ggml_free(ctx); return;
              }

              std::vector<float> y(ggml_nelements(out));
              ggml_backend_tensor_get(out, y.data(), 0, ggml_nbytes(out));

              double sse = 0, sref = 0, maxdiff = 0;
              int n_bad = 0, n_nan = 0;
              for (int64_t j = 0; j < d1; j++) {
                  for (int64_t i = 0; i < d0; i++) {
                      double r;
                      if (!with_matmul) {
                          r = gelu_ref(x[j*din + i]);
                      } else {
                          double acc = bd[i];
                          for (int64_t k = 0; k < din; k++)
                              acc += (double)wd[i*din + k] * x[j*din + k];
                          r = gelu_ref(acc);
                      }
                      double d = y[j*d0 + i] - r;
                      if (std::isnan(y[j*d0 + i])) n_nan++;
                      sse += d*d; sref += r*r;
                      if (std::fabs(d) > maxdiff) maxdiff = std::fabs(d);
                      if (std::fabs(d) > 0.5) n_bad++;
                  }
              }
              printf("%-28s NMSE %.3e  maxdiff %.3e  bad(>0.5) %d  nan %d\n",
                     tag, sref > 0 ? sse/sref : 0.0, maxdiff, n_bad, n_nan);

              ggml_backend_buffer_free(buf);
              ggml_free(ctx);
          }

          int main() {
              ggml_backend_load_all();
              ggml_backend_t htp = nullptr;
              const int ndev = ggml_backend_dev_count();
              for (int i = 0; i < ndev; i++) {
                  ggml_backend_dev_t dev = ggml_backend_dev_get(i);
                  const char * nm = ggml_backend_dev_name(dev);
                  if (nm && strncmp(nm, "HTP", 3) == 0) {
                      htp = ggml_backend_dev_init(dev, nullptr);
                      printf("using device: %s\n", nm);
                      break;
                  }
              }
              if (!htp) { printf("no HTP device found\n"); return 1; }
              printf("OPFUSION env: %s\n", getenv("GGML_HEXAGON_OPFUSION") ? getenv("GGML_HEXAGON_OPFUSION") : "(unset)");

              const float scales[] = {1, 4, 8, 16, 32, 64};
              printf("\n--- A: standalone GELU [5120x1500] (encoder MLP shape) ---\n");
              for (float s : scales) {
                  char tag[64]; snprintf(tag, sizeof tag, "A gelu 5120x1500 x%-5g", s);
                  run_case(htp, tag, 5120, 1500, s, 0);
              }
              printf("\n--- B: matmul+bias+GELU [1280->5120 x 300] (MLP chain) ---\n");
              const float scalesB[] = {1, 8, 32, 64};
              for (float s : scalesB) {
                  char tag[64]; snprintf(tag, sizeof tag, "B mm+gelu 1280>5120 x%-5g", s);
                  run_case(htp, tag, 5120, 300, s, 1);
              }
              printf("\n--- C: q8_0 matmul+bias+GELU [1280->5120 x 300] (real MLP weights) ---\n");
              for (float s : scalesB) {
                  char tag[64]; snprintf(tag, sizeof tag, "C q8mm+gelu x%-5g", s);
                  run_case(htp, tag, 5120, 300, s, 2);
              }
              ggml_backend_free(htp);
              return 0;
          }
          CPEOF
          CXX=$(ls ${{ env.ANDROID_NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android*-clang++ | sort -V | tail -n 1)
          GGML_LIBS=$(find build/bin -maxdepth 1 -name "libggml*.so" | sort | tr '\n' ' ')
          mkdir -p pkg
          "$CXX" -std=c++17 -O2 -fPIC -pthread \
            -I/tmp/llama/ggml/include \
            "$SRC" \
            $GGML_LIBS \
            -Wl,-rpath,'$ORIGIN' \
            -o pkg/gelu-sweep
          echo "=== gelu-sweep 构建完成 ==="
          ls -la pkg/gelu-sweep

      - name: 打包编译产物
        run: |
          mkdir -p pkg
          find build -name "*.so" | xargs -I{} cp {} pkg/
          find build -name "*.so.*" | xargs -I{} cp {} pkg/
          find build -path "*ggml-hexagon*" -name "libggml-htp*.so" -exec cp {} pkg/ \;
          find build/bin -type f -executable | xargs -I{} cp {} pkg/ 2>/dev/null || true
          cd pkg && zip -r ../whisper-hexagon-v81.zip . && cd ..
          echo "=== 打包内容 ==="
          ls -la pkg/

      - name: 上传编译产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: whisper-hexagon-v81-${{ inputs.patch_mode }}-android
          path: whisper-hexagon-v81.zip
          if-no-files-found: error

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v81-${{ inputs.patch_mode }}-build-${{ github.run_number }}
          name: Whisper Hexagon v81 [${{ inputs.patch_mode }}] Build #${{ github.run_number }}
          body: |
            Android Hexagon v81 构建产物 (SM8850)
            补丁模式: ${{ inputs.patch_mode }}

            ## 本版改动
            - 用 llama.cpp 最新 ggml-hexagon 整体覆盖（whisper.cpp 自带版停在 7-10）
            - 新增：L2 缓存一致性重做（dirty bit 跟踪 + 延迟刷写）
            - 新增：hmx-queue 修复、MUL_MAT / FLASH_ATTN 管线优化
            - 新增：WHISPER_BUILD_TESTS=ON，产物含 test-vad 等测试程序
            - patch_mode=${{ inputs.patch_mode }}（none=无补丁 / fp16=非fp32 ADD回退CPU / broadcast=广播ADD回退CPU）

            ## Termux 使用
            ```bash
            export LD_LIBRARY_PATH=.:/vendor/lib64
            ./whisper-cli -m ggml-large-v3-turbo-q8_0.bin -f audio.wav --output-srt
            # 算子正确性测试：
            ./test-backend-ops -b HTP0 -o ADD
            ```
            注意：whisper-cli、libggml*.so、libggml-htp-v81.so 必须整套换新，不要新旧混用
          files: whisper-hexagon-v81.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
