                            "    }\n"
                            "    std::map<const void *, std::vector<float> >::iterator it = g_geludump_cache.find(t);\n"
                            "    if (it == g_geludump_cache.end()) {\n"
                            "        return true;\n"
                            "    }\n"
                            "    g_geludump_n++;\n"
                            "    const std::vector<float> & xin = it->second;\n"
                            "    std::vector<float> yout(nel);\n"
                            "    ggml_backend_tensor_get(t, yout.data(), 0, nel * sizeof(float));\n"
                            "    double mn = 1e30, mx = -1e30, sum = 0.0, sum2 = 0.0;\n"
                            "    double err2 = 0.0, ref2 = 0.0, maxdiff = 0.0;\n"
