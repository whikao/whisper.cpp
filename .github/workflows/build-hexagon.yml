              if mode == "geludump":
                  wpath = "src/whisper.cpp"
                  wsrc = open(wpath).read()

                  d0_old = "// measure the memory usage of a graph and prepare the allocr's internal data buffer"
                  d0_new = ("// SM8850 geludump: in-situ HTP-vs-reference check of GELU outputs (env GGML_HEXAGON_GELUDUMP=1)\n"
                            "// Two-phase: cache input at ask=true (buffer still valid), compare output at ask=false.\n"
                            "#include <map>\n"
                            "static double geludump_erf_ref(double x) {\n"
                            "    return 0.5 * x * (1.0 + erf(x / sqrt(2.0)));\n"
                            "}\n"
                            "static std::map<const void *, std::vector<float> > g_geludump_cache;\n"
                            "static int g_geludump_n = 0;\n"
                            "static bool whisper_geludump_cb(struct ggml_tensor * t, bool ask, void * user_data) {\n"
                            "    (void) user_data;\n"
                            "    if (t->op != GGML_OP_UNARY || ggml_get_unary_op(t) != GGML_UNARY_OP_GELU) {\n"
