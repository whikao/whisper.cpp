name: Build whisper.cpp (Hexagon HTP v81)

on:
  workflow_dispatch:
    inputs:
      whisper_branch:
        description: 'whisper.cpp branch'
        default: 'master'
        required: true
      patch_mode:
        description: 'ADD 补丁：broadcast=图级回退(已验证), kernelfix=修kernel让广播走正确路径(试验)'
        type: choice
        options:
          - none
          - fp16
          - broadcast
          - bcast_only
          - noncontig_only
          - kernelfix
          - krowbcast
          - flushfix
          - flushfix2
          - prof
          - hmxfix
          - hmxdbg
          - hmxfix2
          - hmxdbg2
          - q8mm5
          - geluenc
          - geludump
          - vdbg
          - nospin
          - hybrid
          - gelusync
          - geluxact
          - rxfix
          - gelucpu
          - geluff
        default: 'kernelfix'
        required: true

# 显式赋予创建 Release 的写入权限
permissions:
  contents: write

jobs:
  build-android-hexagon:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'ggml-org/whisper.cpp'
          ref: ${{ github.event.inputs.whisper_branch }}
          submodules: recursive

      - name: 安装编译依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build wget xz-utils

      - name: 下载并设置 Android NDK r28
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          echo "ANDROID_NDK=/tmp/android-ndk-r28" >> $GITHUB_ENV

      - name: 下载并解压 Hexagon SDK v6.6.0.0
        run: |
          cd /tmp
          wget -q https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v6.6.0.0/hexagon-sdk-v6.6.0.0-amd64-lnx.tar.xz
          tar -xf hexagon-sdk-v6.6.0.0-amd64-lnx.tar.xz
          # 动态自动定位包含 'incs' 的真实根目录
          SDK_ROOT=$(find /tmp -maxdepth 3 -type d -name "incs" 2>/dev/null | head -n 1 | xargs dirname)
          if [ -n "$SDK_ROOT" ]; then
            echo "HEXAGON_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
            echo "✅ 成功定位 SDK 真实根目录: $SDK_ROOT"
            TOOLS_PATH=$(find $SDK_ROOT -path "*/HEXAGON_Tools/19.0.07" 2>/dev/null | head -n 1)
            if [ -n "$TOOLS_PATH" ]; then
              echo "HEXAGON_TOOLS_ROOT=$TOOLS_PATH" >> $GITHUB_ENV
              echo "✅ 成功定位 Tools 目录: $TOOLS_PATH"
            else
              echo "❌ 错误: 在 SDK 根目录下未发现 HEXAGON_Tools/19.0.07！"
              exit 1
            fi
          else
            echo "❌ 错误: 解压后未找到包含 'incs' 文件夹的 SDK 目录，请检查解压包！"
            exit 1
          fi

      - name: 修复官方 SDK 的 CMake 兼容性问题
        run: |
          CMAKE_FILE=$(find /tmp -path "*/build/cmake/hexagon_fun.cmake" 2>/dev/null | head -n 1)
          if [ -n "$CMAKE_FILE" ]; then
            sed -i '99,106s/^/# /' "$CMAKE_FILE"
            echo "✅ 成功修复 CMake 文件: $CMAKE_FILE"
          else
            echo "⚠️ 未找到 hexagon_fun.cmake，跳过修复步骤。"
          fi

      # 【核心改动】用 llama.cpp 最新的 ggml-hexagon 整体覆盖 whisper.cpp 自带的旧版
      - name: 覆盖最新 ggml-hexagon（含 L2 缓存重做 + HMX 修复）
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama
          rm -rf ggml/src/ggml-hexagon
          cp -r /tmp/llama/ggml/src/ggml-hexagon ggml/src/
          cp -f /tmp/llama/ggml/include/ggml-hexagon.h ggml/include/ggml-hexagon.h
          echo "=== 覆盖完成，新版关键默认值（应显示 mm_select=3 / fa_select=2）==="
          grep -n "opt_mm_select = \|opt_fa_select = " ggml/src/ggml-hexagon/ggml-hexagon.cpp || true
          echo "=== 确认新版文件就位（应有 dma-queue.c / work-queue.c / htp-tensor.c）==="
          ls ggml/src/ggml-hexagon/htp/ || true

      # 【ADD 补丁】在覆盖之后、编译之前打。找不到锚点会显式报错（防止白编）
      - name: 打 ADD 补丁 A 组 (patch_mode=${{ inputs.patch_mode }})
        run: |
          python3 - << 'EOF'
          mode = "${{ inputs.patch_mode }}"

          if mode == "none":
              print("patch_mode=none，跳过补丁")
              raise SystemExit(0)

          if mode == "nospin":
              # nospin: ggml 线程池默认 poll=50(混合自旋),工作线程空闲时
              # 自旋 ~1024*128*50 轮才睡眠,空转烧电。改为环境变量
              # GGML_THREADPOLL 控制:设 0 = 直接睡眠,不设 = 默认 50。
              gpath = "ggml/src/ggml.c"
              gsrc = open(gpath).read()
              p_old = "    p->poll       = 50;    // hybrid-polling enabled"
              p_new = ("    p->poll       = 50;    // hybrid-polling enabled\n"
                       "    {\n"
                       "        // SM8850 nospin: env GGML_THREADPOLL overrides polling level\n"
                       "        const char * tp_env = getenv(\"GGML_THREADPOLL\");\n"
                       "        if (tp_env) {\n"
                       "            p->poll = (uint32_t) atoi(tp_env);\n"
                       "        }\n"
                       "    }")
              if gsrc.count(p_old) != 1:
                  print("ERROR: nospin anchor (poll=50) not found, abort!")
                  raise SystemExit(1)
              open(gpath, "w").write(gsrc.replace(p_old, p_new))
              print("OK: nospin poll env override applied, q8mm5 补丁在 B 组 step 继续")
              raise SystemExit(0)

          if mode == "vdbg":
              # vdbg: 提升 ggml-hexagon 的 GGML_LOG_DEBUG 为 INFO,
              # 使 GGML_HEXAGON_VERBOSE=2 能打印 execute-op / htp-tensor /
              # htp-buf / op-queue push 等 per-op 明细(release 编译默认裁剪 DEBUG)。
              import glob, re
              nfiles = 0
              nlines = 0
              for f in glob.glob("ggml/src/ggml-hexagon/**/*.c*", recursive=True):
                  s = open(f).read()
                  n = s.count("GGML_LOG_DEBUG")
                  if n:
                      open(f, "w").write(s.replace("GGML_LOG_DEBUG", "GGML_LOG_INFO"))
                      nfiles += 1
                      nlines += n
              print("OK: vdbg promoted GGML_LOG_DEBUG -> GGML_LOG_INFO in %d files (%d sites)" % (nfiles, nlines))
              if nfiles == 0:
                  print("ERROR: vdbg found no GGML_LOG_DEBUG sites, abort!")
                  raise SystemExit(1)
              print("vdbg 日志提升完成，q8mm5 补丁在 B 组 step 继续")
              raise SystemExit(0)


          if mode == "hmxfix":
              # 放宽 HMX 矩阵乘的行数门槛：M=4 (bs3 bo3) 也走 HMX
              # 实测 bs5 bo5 (M=6) 走 HMX 后每行吞吐为 HVX 的 1.7 倍
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old = "    if (m <= HTP_MM_HMX_MIN_NROWS) {"
              t_new = "    if (m < HTP_MM_HMX_MIN_NROWS) { // SM8850 v81: allow M=4 on HMX"

              if tsrc.count(t_old) != 1:
                  print("ERROR: hmxfix anchor not found in ggml-hexagon.cpp, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: hmxfix applied to ggml-hexagon.cpp")
              raise SystemExit(0)

          if mode == "hmxdbg":
              # hmxfix + 诊断日志：打印每个 matmul 的 M/批处理/类型/资格判定
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old1 = "    if (m <= HTP_MM_HMX_MIN_NROWS) {"
              t_new1 = "    if (m < HTP_MM_HMX_MIN_NROWS) { // SM8850 v81: allow M=4 on HMX"
              if tsrc.count(t_old1) != 1:
                  print("ERROR: hmxdbg anchor1 not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(t_old1, t_new1)

              t_old2 = ("    // Check HMX eligibility and try precomputing HMX parameters\n"
                        "    bool hmx_enabled = (sess->n_hmx > 0) && (opt_mm_select >= 3);\n")
              t_new2 = ("    // Check HMX eligibility and try precomputing HMX parameters\n"
                        "    bool hmx_enabled = (sess->n_hmx > 0) && (opt_mm_select >= 3);\n"
                        "    GGML_LOG_INFO(\"ggml-hex: hmxdbg ne00 %d ne01 %d ne10 %d ne11 %d ne12 %d m %d batched %d wtype %d elig %d\\n\", (int) src0->ne[0], (int) src0->ne[1], (int) src1->ne[0], ne11, ne12, (is_matmul_id ? ne12 : ne11), (int) is_batched, (int) wtype, (int) ggml_hexagon_matmul_is_hmx_eligible(src0, src1, dst, ne01_padded, is_matmul_id, is_batched));\n")
              if tsrc.count(t_old2) != 1:
                  print("ERROR: hmxdbg anchor2 not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(t_old2, t_new2)

              open(tpath, "w").write(tsrc)
              print("OK: hmxdbg applied to ggml-hexagon.cpp (2 anchors)")
              raise SystemExit(0)

          if mode == "hmxdbg2":
              # hmxfix2(门槛全放) + 打印 elig / preok / kernel_type，定位 HMX 回退原因
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old1 = "    if (m <= HTP_MM_HMX_MIN_NROWS) {"
              t_new1 = "    if (m < 1) { // SM8850 v81: HMX for any M (decode M=3)"
              if tsrc.count(t_old1) != 1:
                  print("ERROR: hmxdbg2 anchor1 not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(t_old1, t_new1)

              t_old2 = ("    if (hmx_enabled && ggml_hexagon_matmul_is_hmx_eligible(src0, src1, dst, ne01_padded, is_matmul_id, is_batched)) {\n"
                        "        if (ggml_hexagon_precompute_hmx_mm_params(sess, src0, src1, dst, wtype, ne00_padded, ne01_padded, ne02, ne11, ne12, ne11_padded, is_matmul_id, is_batched, vtcm_budget, kparams)) {\n"
                        "            goto finalize;\n"
                        "        }\n"
                        "    }\n")
              t_new2 = ("    {\n"
                        "        bool elig = hmx_enabled && ggml_hexagon_matmul_is_hmx_eligible(src0, src1, dst, ne01_padded, is_matmul_id, is_batched);\n"
                        "        bool preok = false;\n"
                        "        if (elig) {\n"
                        "            preok = ggml_hexagon_precompute_hmx_mm_params(sess, src0, src1, dst, wtype, ne00_padded, ne01_padded, ne02, ne11, ne12, ne11_padded, is_matmul_id, is_batched, vtcm_budget, kparams);\n"
                        "        }\n"
                        "        GGML_LOG_INFO(\"ggml-hex: hmxdbg2 ne00 %d ne01 %d ne11 %d m %d batched %d wtype %d elig %d preok %d vtcm %zu\\n\", (int) src0->ne[0], (int) src0->ne[1], ne11, (is_matmul_id ? ne12 : ne11), (int) is_batched, (int) wtype, (int) elig, (int) preok, vtcm_budget);\n"
                        "        if (preok) {\n"
                        "            goto finalize;\n"
                        "        }\n"
                        "    }\n")
              if tsrc.count(t_old2) != 1:
                  print("ERROR: hmxdbg2 anchor2 not found, abort!")
                  raise SystemExit(1)
              tsrc = tsrc.replace(t_old2, t_new2)

              open(tpath, "w").write(tsrc)
              print("OK: hmxdbg2 applied to ggml-hexagon.cpp (2 anchors)")
              raise SystemExit(0)

          if mode == "hmxfix2":
              # 彻底放开 HMX 行数门槛：decode M=3 (bs3 bo3) 也走 HMX
              # 日志实测 decode matmul m=3 elig=0 被门槛拦截；encoder m=1500/448 本就走 HMX
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old = "    if (m <= HTP_MM_HMX_MIN_NROWS) {"
              t_new = "    if (m < 1) { // SM8850 v81: HMX for any M (decode M=3)"

              if tsrc.count(t_old) != 1:
                  print("ERROR: hmxfix2 anchor not found in ggml-hexagon.cpp, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: hmxfix2 applied to ggml-hexagon.cpp")
              raise SystemExit(0)

          if mode == "prof":
              # 诊断版：把 profile 逐算子耗时日志从 DEBUG 提为 INFO（release 构建可见）
              # 运行时配合 GGML_HEXAGON_PROFILE=3（或1）使用
              tpath = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
              tsrc = open(tpath).read()

              t_old = 'GGML_LOG_DEBUG("ggml-hex: %s profile-'
              t_new = 'GGML_LOG_INFO("ggml-hex: %s profile-'

              if tsrc.count(t_old) != 2:
                  print("ERROR: prof anchor count != 2 in ggml-hexagon.cpp, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: prof applied to ggml-hexagon.cpp (2 log sites)")
              raise SystemExit(0)

          if mode == "flushfix":
              # 修缓存层：对所有 compute 输入无条件 flush，绕过 dirty 区间跟踪（htp/htp-tensor.c）
              tpath = "ggml/src/ggml-hexagon/htp/htp-tensor.c"
              tsrc = open(tpath).read()

              t_old = "        if (t && (t->flags & HTP_TENSOR_COMPUTE) && is_tensor_dirty(ctx, t)) {"
              t_new = "        if (t && (t->flags & HTP_TENSOR_COMPUTE) && (is_tensor_dirty(ctx, t) || true)) { // SM8850 v81 fix: unconditional flush"

              if tsrc.count(t_old) != 1:
                  print("ERROR: flushfix anchor not found in htp-tensor.c, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: flushfix applied to htp-tensor.c")
              raise SystemExit(0)

          if mode in ("kernelfix", "krowbcast"):
              # 修 kernel：收紧 same_shape 判定；kernelfix=禁用row_bcast，krowbcast=保留row_bcast
              kpath = "ggml/src/ggml-hexagon/htp/binary-ops.c"
              ksrc = open(kpath).read()
          
              k_old = (
                  "    bool is_same_shape = !is_add_id && !is_scalar && !is_transposed &&\n"
                  "               (src1->ne[0] == src0->ne[0] && src0->ne[0] % VLEN == 0) &&\n"
                  "               (src1->ne[1] == src0->ne[1] || src1->ne[1] == 1) &&\n"
                  "               (src1->ne[2] == src0->ne[2] || src1->ne[2] == 1) &&\n"
                  "               (src1->ne[3] == src0->ne[3] || src1->ne[3] == 1);\n"
                  "\n"
                  "    bool is_row_bcast = is_same_shape && (src1->ne[1] == 1 && src1->ne[2] == 1 && src1->ne[3] == 1);")
          
              k_new = (
                  "    // SM8850 v81 fix: same_shape requires full 4-dim equality (dim-broadcast DMA read OOB)\n"
                  "    bool is_same_shape = !is_add_id && !is_scalar && !is_transposed &&\n"
                  "               (src1->ne[0] == src0->ne[0] && src0->ne[0] % VLEN == 0) &&\n"
                  "               (src1->ne[1] == src0->ne[1]) &&\n"
                  "               (src1->ne[2] == src0->ne[2]) &&\n"
                  "               (src1->ne[3] == src0->ne[3]);\n"
                  "\n"
                  "    // SM8850 v81 fix: disable row_bcast fast path; broadcast ADD goes to complex path\n"
                  "    bool is_row_bcast = false;")
          
              k_new_rb = (
                  "    // SM8850 v81 fix: same_shape requires full 4-dim equality (dim-broadcast DMA read OOB)\n"
                  "    bool is_same_shape = !is_add_id && !is_scalar && !is_transposed &&\n"
                  "               (src1->ne[0] == src0->ne[0] && src0->ne[0] % VLEN == 0) &&\n"
                  "               (src1->ne[1] == src0->ne[1]) &&\n"
                  "               (src1->ne[2] == src0->ne[2]) &&\n"
                  "               (src1->ne[3] == src0->ne[3]);\n"
                  "\n"
                  "    // SM8850 v81 fix: row_bcast kept, defined independently of same_shape\n"
                  "    bool is_row_bcast = !is_add_id && !is_scalar && !is_transposed &&\n"
                  "               (src1->ne[0] == src0->ne[0] && src0->ne[0] % VLEN == 0) &&\n"
                  "               (src1->ne[1] == 1 && src1->ne[2] == 1 && src1->ne[3] == 1);")

              k_use = k_new if mode == "kernelfix" else k_new_rb
              if ksrc.count(k_old) != 1:
                  print("ERROR: kernel patch anchor not found in binary-ops.c, abort!")
                  raise SystemExit(1)
              open(kpath, "w").write(ksrc.replace(k_old, k_use))
              print("OK: %s applied to binary-ops.c" % mode)
              raise SystemExit(0)
          
          path = "ggml/src/ggml-hexagon/ggml-hexagon.cpp"
          src = open(path).read()
          
          old = """        case GGML_OP_MUL:
                  case GGML_OP_ADD:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;"""
          
          fp16_new = """        case GGML_OP_MUL:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;
          
                  case GGML_OP_ADD:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      // SM8850 v81 workaround: non-fp32 ADD broken on HTP, fall back to CPU
                      if (supp && (op->src[0]->type != GGML_TYPE_F32 ||
                                   op->src[1]->type != GGML_TYPE_F32)) {
                          supp = false;
                      }
                      break;"""
          
          bcast_new = """        case GGML_OP_MUL:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;
          
                  case GGML_OP_ADD:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      // SM8850 v81 workaround: broadcast/non-contiguous ADD broken on HTP, fall back to CPU
                      if (supp && (!ggml_is_contiguous(op->src[0]) ||
                                   !ggml_is_contiguous(op->src[1]) ||
                                   op->src[0]->ne[0] != op->src[1]->ne[0] ||
                                   op->src[0]->ne[1] != op->src[1]->ne[1] ||
                                   op->src[0]->ne[2] != op->src[1]->ne[2] ||
                                   op->src[0]->ne[3] != op->src[1]->ne[3])) {
                          supp = false;
                      }
                      break;"""
          
          bcast_only_new = """        case GGML_OP_MUL:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;
          
                  case GGML_OP_ADD:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      // SM8850 v81 workaround: broadcast/non-contiguous ADD broken on HTP, fall back to CPU
                      if (supp && (op->src[0]->ne[0] != op->src[1]->ne[0] ||
                                   op->src[0]->ne[1] != op->src[1]->ne[1] ||
                                   op->src[0]->ne[2] != op->src[1]->ne[2] ||
                                   op->src[0]->ne[3] != op->src[1]->ne[3])) {
                          supp = false;
                      }
                      break;"""
          
          noncontig_only_new = """        case GGML_OP_MUL:
                  case GGML_OP_SUB:
                  case GGML_OP_DIV:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      break;
          
                  case GGML_OP_ADD:
                      supp = ggml_hexagon_supported_binary(sess, op);
                      // SM8850 v81 workaround: non-contiguous ADD broken on HTP, fall back to CPU
                      if (supp && (!ggml_is_contiguous(op->src[0]) ||
                                   !ggml_is_contiguous(op->src[1]))) {
                          supp = false;
                      }
                      break;"""
          
          if mode not in ("fp16", "broadcast", "bcast_only", "noncontig_only"):
              print("patch_mode=" + mode + " 不在本 step（A），跳过")
              raise SystemExit(0)

          new = {"fp16": fp16_new, "broadcast": bcast_new,
                 "bcast_only": bcast_only_new, "noncontig_only": noncontig_only_new}[mode]
          
          if src.count(old) != 1:
              print("ERROR: patch anchor not found (upstream changed), abort!")
              raise SystemExit(1)
          
          open(path, "w").write(src.replace(old, new))
          print("OK: %s patch applied" % mode)

          if mode == "flushfix2":
              # 轻量变体：每个 op 前整片 L2 刷一次（比逐张量 flush 便宜），绕过 dirty 跟踪
              tpath = "ggml/src/ggml-hexagon/htp/htp-tensor.c"
              tsrc = open(tpath).read()

              t_old = ("void htp_tensor_flush_all(struct htp_context * ctx, const struct htp_tensor * const * tensors, uint32_t n) {\n"
                       "    const struct htp_tensor * dirty_tensors[HTP_OP_MAX_INPUTS];")
              t_new = ("void htp_tensor_flush_all(struct htp_context * ctx, const struct htp_tensor * const * tensors, uint32_t n) {\n"
                       "    flush_all_dcache(ctx); // SM8850 v81 fix: full L2 flush per op, bypass dirty tracking\n"
                       "    const struct htp_tensor * dirty_tensors[HTP_OP_MAX_INPUTS];")

              if tsrc.count(t_old) != 1:
                  print("ERROR: flushfix2 anchor not found in htp-tensor.c, abort!")
                  raise SystemExit(1)
              open(tpath, "w").write(tsrc.replace(t_old, t_new))
              print("OK: flushfix2 applied to htp-tensor.c")
              raise SystemExit(0)

          print("patch_mode=" + mode + " 不在本 step（A），跳过")
          EOF

      - name: 打 ADD 补丁 B 组 q8 系列 (patch_mode=${{ inputs.patch_mode }})
        run: |
          python3 - << 'EOF'
          mode = "${{ inputs.patch_mode }}"

