                            "        c.resize(nel);\n"
                            "        ggml_backend_tensor_get(src, c.data(), 0, nel * sizeof(float));\n"
                            "        return true;\n"
                            "    }\n"
                            "    std::map<const void *, std::vector<float> >::iterator it = g_geludump_cache.find(t);\n"
                            "    if (it == g_geludump_cache.end()) {\n"
                            "        return true;\n"
                            "    }\n"
                            "    g_geludump_n++;\n"
                            "    const std::vector<float> & xin = it->second;\n"
                            "    std::vector<float> yout(nel);\n"
                            "    ggml_backend_tensor_get(t, yout.data(), 0, nel * sizeof(float));\n"
                            "    double mn = 1e30, mx = -1e30, sum = 0.0, sum2 = 0.0;\n"
                            "    double err2 = 0.0, ref2 = 0.0, maxdiff = 0.0;\n"
                            "    long bad = 0, nan = 0;\n"
                            "    for (size_t i = 0; i < nel; i++) {\n"
                            "        double v = xin[i];\n"
                            "        if (v < mn) mn = v;\n"
                            "        if (v > mx) mx = v;\n"
                            "        sum  += v;\n"
                            "        sum2 += v * v;\n"
                            "        double r = geludump_erf_ref(v);\n"
                            "        double d = fabs((double) yout[i] - r);\n"
                            "        if (!(d == d)) { nan++; d = 0.0; }\n"
                            "        err2 += d * d;\n"
                            "        ref2 += r * r;\n"
                            "        if (d > maxdiff) maxdiff = d;\n"
                            "        if (d > 0.5) bad++;\n"
                            "    }\n"
                            "    double mean = sum / nel;\n"
                            "    double var  = sum2 / nel - mean * mean;\n"
                            "    fprintf(stderr, \"geludump #%d: ne %lld x %lld  in[min %8.3f max %8.3f mean %7.3f std %6.3f]  NMSE %.3e maxdiff %.3e bad(>0.5) %ld nan %ld\\n\",\n"
                            "            g_geludump_n, (long long) t->ne[0], (long long) t->ne[1], mn, mx, mean, var > 0 ? sqrt(var) : 0.0,\n"
                            "            ref2 > 0 ? err2 / ref2 : 0.0, maxdiff, bad, nan);\n"
                            "    g_geludump_cache.erase(it);\n"
                            "    return true;\n"
                            "}\n"
                            "\n"
                            "// measure the memory usage of a graph and prepare the allocr's internal data buffer")
                  if wsrc.count(d0_old) != 1:
